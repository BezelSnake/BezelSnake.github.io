<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configure Module · BezelSnake</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100svh; padding: 4vh 2.5vw 1.8vh 1.5vw;
  display: grid; grid-template-columns: clamp(225px, 19.5vw, 320px) minmax(0,1fr);
  grid-template-rows: minmax(0,1fr) auto; gap: 2.3vh .85vw;
  font: 16px Arial, sans-serif; color: white; color-scheme: dark;
  background: radial-gradient(ellipse at center,#2e5a3e,#1a3524 55%,#0a1410);
}
aside { padding-inline: .7vw; }
h1 { margin: 0 0 40px; text-align: center; font-size: 24px; }
h2 { font-size: 16px; margin: 0 0 24px 4px; }
button, summary, a { font: inherit; color: inherit; cursor: pointer; }
details { position: relative; }
summary, .options { background: #172c20; border: 1px solid #617066; border-radius: 9px; }
summary { display: flex; align-items: center; justify-content: space-between; padding: 12px; font-size: 15px; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::after { content: '▼'; }
.options { position: absolute; z-index: 1; top: calc(100% + 5px); right: 0; min-width: 178px; padding: 6px; }
.options label { position: relative; cursor: pointer; display: flex; align-items: center; gap: 6px; border-radius: 4px; padding: 3px 5px; font-size: 14px; }
.options label:hover, .options label:focus-within { background: #304d39; }
.options input { width: 1px; height: 1px; opacity: 0; position: absolute; }
.options small { margin-left: auto; }
.options label:has(:checked)::after { content: '✓'; }
.group { display: flex; align-items: center; gap: 4px; margin: 4px 0; font-size: 10px; }
.group::before,.group::after { content:''; flex: 1; border-top: 1px dotted #adbaae; }
.cover { display: block; width: 100%; height: calc(100svh - 114px); object-fit: cover; }
.launch { grid-column: 2; justify-self: end; margin-right: 1.7vw; width: min(298px,100%); text-align: center; padding: 11px; border-radius: 9px; border: 1px solid #536e59; background: #274c35; font-size: 24px; font-weight: bold; text-decoration: none; }
.launch:hover { background: #346345; }
@media (max-width: 680px) {
  body { display: flex; flex-direction: column; gap: 18px; padding: 16px; }
  h1,h2 { margin-bottom: 12px; }
  .cover { height: auto; }
  .launch { align-self: end; margin: 0; }
}
</style>
</head>
<body>
<aside>
  <h1>Configure</h1>
  <h2 id="version-label">Version:</h2>
  <details id="versions">
    <summary aria-labelledby="version-label selection"><span id="selection">1.8.8　(WASM)　(default)</span></summary>
    <div class="options" role="radiogroup" aria-labelledby="version-label">
      <label><input type="radio" name="version" value="1.8.8" checked>1.8.8 <small>(WASM)</small></label>
      <label><input type="radio" name="version" value="26.3">26.3 (Latest) <small>(WASM)</small></label>
      <label><input type="radio" name="version" value="26.2">26.2 <small>(WASM)</small></label>
      <div class="group">Lower-end devices</div>
      <label><input type="radio" name="version" value="1.12.2">1.12.2 <small>(WASM)</small></label>
      <label><input type="radio" name="version" value="1.5.2">1.5.2 <small>(None)</small></label>
    </div>
  </details>
</aside>
<img class="cover" src="cover.webp" alt="Game characters">
<a class="launch" id="launch" href="'../macromd/?version='">Launch</a>
<script>
const versions = document.querySelector('#versions');
const summary = versions.querySelector('summary');
function syncVersion() {
  const choice = versions.querySelector(':checked');
  document.querySelector('#selection').textContent = choice.parentElement.textContent.trim()
    + (choice.defaultChecked ? '　(default)' : '');
  document.querySelector('#launch').href = '../millcroft/?version=' + choice.value;
}
function closeMenu() {
  versions.open = false;
  summary.focus();
}
versions.addEventListener('change', syncVersion);
versions.addEventListener('click', event => {
  if (event.target.matches('input')) { syncVersion(); closeMenu(); }
});
versions.addEventListener('keydown', event => {
  if (event.key === 'Escape' || (event.key === 'Enter' && event.target.matches('input'))) {
    event.preventDefault();
    closeMenu();
  }
});
document.addEventListener('click', event => {
  if (!versions.contains(event.target)) versions.open = false;
});
document.querySelector('#launch').addEventListener('click', event => {
  if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
  try {
    sessionStorage.setItem('millcroft.version', versions.querySelector(':checked').value);
  } catch {
    return; // The version in the link also works when storage is disabled.
  }
  event.preventDefault();
  location.assign('../macromd/');
});
window.addEventListener('pageshow', syncVersion);
</script>
</body>
</html>
