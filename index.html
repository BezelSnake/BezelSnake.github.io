    <script>
        // ==========================================
        // 1. SCENE SETUP & SKYBOX
        // ==========================================
        const scene = new THREE.Scene();
        
        // Pure Blue Sky
        scene.background = new THREE.Color(0x5cb8ff);
        // Push the fog way back so you can see the massive grid
        scene.fog = new THREE.Fog(0x5cb8ff, 200, 800); 

        // The Sun (A glowing sphere far away)
        const sunGeo = new THREE.SphereGeometry(20, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
        const sunMesh = new THREE.Mesh(sunGeo, sunMat);
        sunMesh.position.set(80, 100, -200);
        scene.add(sunMesh);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 400);
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // 2. LIGHTING (Sun)
        // ==========================================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); 
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 80, 30);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 250;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);

        // Editor Grid
        const gridHelper = new THREE.GridHelper(40000, 20000, 0xffcc00, 0x444444);
        gridHelper.position.y = 0.01;
        gridHelper.visible = false;
        scene.add(gridHelper);

        // ==========================================
        // 3. SMOOTH 1-PIECE CHARACTER
        // ==========================================
        const playerGroup = new THREE.Group();
        const playerName = localStorage.getItem('obbyName') || "Player";
        let playerColor = parseInt(localStorage.getItem('obbyColor')) || 0xff0000;
        const playerMat = new THREE.MeshStandardMaterial({ color: playerColor, roughness: 0.3, metalness: 0.1 });

        const points = [];
        points.push(new THREE.Vector2(0, 0));      
        points.push(new THREE.Vector2(0.25, 0));    
        points.push(new THREE.Vector2(0.15, 1.0));  
        points.push(new THREE.Vector2(0.3, 1.8));   
        points.push(new THREE.Vector2(0.18, 2.1));  
        points.push(new THREE.Vector2(0.35, 2.5));  
        points.push(new THREE.Vector2(0.25, 2.8));

                function loadWeaponModels() {
            const modelsToLoad = {
                'spiky': { folder: 'low-poly-spiked-ball/', obj: 'spiked-ball', mtl: null },
                'mine': { folder: 'low_poly_landmine/', obj: 'low_poly_landmine', mtl: 'low_poly_landmine' },
                'mg': { folder: 'Mini-gun/', obj: 'Mini-gun', mtl: 'Mini-gun' },
                'lob': { folder: 'dynamite/', obj: 'Dynamite', mtl: 'Dynamite' },
                'nuke': { folder: 'Smash_karts_nuke/', obj: 'tinker', mtl: 'obj' }
            };

            // Load Weapons
            for (const [key, data] of Object.entries(modelsToLoad)) {
                const loadOBJ = (materials = null) => {
                    const objLoader = new THREE.OBJLoader();
                    if (materials) objLoader.setMaterials(materials);
                    objLoader.setPath(baseModelPath + data.folder);
                    
                    objLoader.load(data.obj + '.obj', (object) => {
                        object.scale.set(0.1, 0.1, 0.1); 
                        const box = new THREE.Box3().setFromObject(object);
                        const center = box.getCenter(new THREE.Vector3());
                        object.position.sub(center);
                        weaponModels[key] = object;
                    });
                };

                if (!data.mtl) { loadOBJ(); continue; }

                const mtlLoader = new THREE.MTLLoader();
                mtlLoader.setPath(baseModelPath + data.folder);
                mtlLoader.load(data.mtl + '.mtl', (materials) => {
                    materials.preload();
                    loadOBJ(materials);
                }, undefined, () => loadOBJ());
            }

            // Load Lootbox Chest
                        // Load Lootbox Chest
            const chestMtlLoader = new THREE.MTLLoader();
            chestMtlLoader.setPath(baseModelPath + 'low_poly_treasure_chest_3d_model/');
            chestMtlLoader.load('low_poly_treasure_chest_3d_model.mtl', (materials) => {
                materials.preload();
                const chestObjLoader = new THREE.OBJLoader();
                chestObjLoader.setMaterials(materials);
                chestObjLoader.setPath(baseModelPath + 'low_poly_treasure_chest_3d_model/');
                chestObjLoader.load('low_poly_treasure_chest_3d_model.obj', (object) => {
                    lootboxModel = object;
                    rebuildLevel();
                });
            });
            
        }

        function connectObby(code, isHost) {
            disconnectObby();
            const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            // Change this line:
            const wsUrl = `${wsProtocol}api.bezelsnake.io/obby?code=${code}&host=${isHost}&name=${encodeURIComponent(playerName)}&color=${playerColor}`;
            obbySocket = new WebSocket(wsUrl);
            
            obbySocket.onopen = () => {
                if (isHost) {
                    obbySocket.send(JSON.stringify({ type: 'obby-level', levelData: levelData }));
                }
            };

            obbySocket.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);

                                        if (data.type === 'obby-init') {
                        myClientId = data.id;
                        if (data.levelData && data.levelData.length > 0) {
                            levelData = data.levelData;
                            rebuildLevel();
                        }
                        // Spawn all existing players immediately
                        if (data.players) {
                            data.players.forEach(p => {
                                if (p.id !== myClientId) updateRemotePlayer(p.id, p.x, p.y, p.z, p.rot, p.aim || 0, p.name, p.color);
                            });
                        }
                    } 
                    else if (data.type === 'obby-player-joined') {
                        if (data.player.id !== myClientId) {
                            updateRemotePlayer(data.player.id, data.player.x, data.player.y, data.player.z, data.player.rot, data.player.aim || 0, data.player.name, data.player.color);
                        }
                    }
                    else if (data.type === 'obby-sync') {
                        if (data.players) {
                            const activeIds = new Set();
                            
                            data.players.forEach(p => {
                                activeIds.add(p.id);
                                if (p.id !== myClientId) updateRemotePlayer(p.id, p.x, p.y, p.z, p.rot, p.aim || 0, p.name, p.color);
                            });

                            remotePlayers.forEach((rp, id) => {
                                if (!activeIds.has(id)) {
                                    removeRemotePlayer(id);
                                }
                            });
                        }
                    } else if (data.type === 'obby-level') {
                        if (isReadOnly) {
                            // ABSOLUTE SYNC: Accept whatever the host sends, even if it's empty!
                            levelData = data.levelData;
                            rebuildLevel();
                        }
                    }else if (data.type === 'obby-move') {
                        updateRemotePlayer(data.id, data.x, data.y, data.z, data.rot);
                    } else if (data.type === 'obby-disconnect') {
                        removeRemotePlayer(data.id);
                    }
                    else if (data.type === 'obby-weapon') {
                        if (data.action === 'pickup') {
                            // Remote player picked up a weapon
                            remoteWeaponGroup.clear();
                            
                            // NEW: Put the weapon in their hand!
                            const rp = remotePlayers.get(data.id);
                            if (rp && rp.weaponGroup && data.weaponType) {
                                // Clear old weapons
                                while(rp.weaponGroup.children.length > 0) rp.weaponGroup.remove(rp.weaponGroup.children[0]);
                                
                                if (weaponModels[data.weaponType]) {
                                    const wMesh = weaponModels[data.weaponType].clone();
                                    
                                    // Position it exactly like the local player's hand
                                    if (data.weaponType === 'nuke') {
                                        wMesh.scale.set(0.01, 0.01, 0.01);
                                        wMesh.position.set(0, 0.9, 0.6);
                                        wMesh.rotation.set(0, 0, 0);
                                    } else {
                                        wMesh.scale.set(0.01, 0.01, 0.01);
                                        wMesh.position.set(0, 1.0, 0.8);
                                        wMesh.rotation.set(0, Math.PI, 0);
                                    }
                                    rp.weaponGroup.add(wMesh);
                                }
                            }
                            
                            // Find the chest at those coordinates and hide it
                            if (data.x !== undefined) {
                                levelGroup.children.forEach(c => {
                                    if (c.userData.type === 'lootbox' && c.userData.active) {
                                        if (c.position.distanceTo(new THREE.Vector3(data.x, data.y, data.z)) < 2) {
                                            c.userData.active = false;
                                            c.visible = false;
                                            
                                            // Mark the original data so the editor ignores it
                                            levelData.forEach(obj => {
                                                if (obj.type === 'lootbox' && Math.abs(obj.x - data.x) < 0.5 && Math.abs(obj.y - data.y) < 0.5 && Math.abs(obj.z - data.z) < 0.5) {
                                                    obj.collected = true;
                                                }
                                            });
                                        }
                                    }
                                });
                            }
                        } else if (data.action === 'activate') {
                            // NEW: If they fired a weapon, remove it from their hand
                            if (['lob', 'nuke', 'mg', 'mine'].includes(data.weaponType)) {
                                const rp = remotePlayers.get(data.id);
                                if (rp && rp.weaponGroup) {
                                    while(rp.weaponGroup.children.length > 0) rp.weaponGroup.remove(rp.weaponGroup.children[0]);
                                }
                            }

                            // Remote player activated a weapon
                            if (data.weaponType === 'invincible') {
                                const bubble = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.3 }));
                                remotePlayers.forEach(p => p.group.add(bubble));
                                setTimeout(() => remotePlayers.forEach(p => p.group.remove(bubble)), 10000);
                            }
                        }
                    }

                    else if (data.type === 'obby-projectile') {
                        // Someone else fired a projectile
                        let rMesh;
                        if (weaponModels[data.projType]) {
                            rMesh = weaponModels[data.projType].clone();
                            rMesh.scale.set(0.02, 0.02, 0.02);
                        } else {
                            const isNuke = data.projType === 'nuke';
                            const geo = isNuke ? new THREE.SphereGeometry(0.5, 16, 16) : new THREE.CylinderGeometry(0.3, 0.3, 0.8, 8);
                            rMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: isNuke ? 0x22aa22 : 0xdd2222 }));
                        }
                        
                        rMesh.position.set(data.x, data.y, data.z);
                        rMesh.rotation.y = Math.atan2(data.dirX, data.dirZ);
                        scene.add(rMesh);
                        
                        activeProjectiles.push({
                            mesh: rMesh, 
                            dir: new THREE.Vector3(data.dirX, 0, data.dirZ), 
                            type: data.projType, 
                            speed: data.projType === 'nuke' ? 20 : 30, 
                            vy: data.projType === 'nuke' ? 0 : 5, 
                            time: performance.now(),
                            lastTrail: performance.now(),
                            isRemote: true // <--- ADD THIS
                        });
                    }

                } catch (err) {}
            };
        }

        function disconnectObby() {
            if (obbySocket) {
                obbySocket.close();

        function updateRemotePlayer(id, x, y, z, rot, aim = 0, name = 'Player', color = 0xff0000) {
            let data = remotePlayers.get(id);
            if (!data) {
                const group = new THREE.Group();
                // Create unique material based on their color
                const rMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.1 });
                const body = new THREE.Mesh(bodyGeo, rMat);
                body.castShadow = true;
                group.add(body);
                
                // Create Name Tag
                const nameTag = createNameTag(name);
                group.add(nameTag);

                // Add a weapon hand to the remote player
                const remoteWGroup = new THREE.Group();
                group.add(remoteWGroup);

                scene.add(group);
                
                group.position.set(x, y, z);
                group.rotation.y = rot;
                
                data = { 
                    group: group, 
                    body: body, 
                    nameTag: nameTag,
                    weaponGroup: remoteWGroup, 
                    walkTime: 0, 
                    targetX: x, targetY: y, targetZ: z, targetRot: rot,
                    targetAim: aim,
                    currentAim: aim,
                    name: name,
                    color: color,
                    visualOffset: new THREE.Vector3(0, 0, 0) 
                };
                remotePlayers.set(id, data);
            } else {
                data.targetX = x;
                data.targetY = y;
                data.targetZ = z;
                data.targetRot = rot;
                
                if (aim !== undefined) {
                    data.targetAim = aim;
                }
            }
        }

        // Helper function to generate the text above their head
        function createNameTag(name) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.font = 'Bold 28px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowColor = 'black';
            ctx.shadowBlur = 4;
            ctx.fillText(name, 128, 32);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture, depthTest: false });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(6, 1.5, 1);
            sprite.position.y = 3.5;
            return sprite;
        }

        // --- FACTORY FUNCTIONS ---
        function buildPlatform(x, y, z, width, depth, isSafe = false) {
            const group = new THREE.Group();
            group.position.set(x, y, z);

            const walls = new THREE.Mesh(new THREE.BoxGeometry(width, 20, depth), wallMat);
            walls.position.y = -10;
            walls.castShadow = true;
            walls.receiveShadow = true;
            group.add(walls);

            const roof = new THREE.Mesh(new THREE.BoxGeometry(width, 0.2, depth), isSafe ? baseMat : baseMat);
            roof.position.y = 0.1;
            roof.receiveShadow = true;
            group.add(roof);

            const tThick = 0.4;
            const t1 = new THREE.Mesh(new THREE.BoxGeometry(width, 0.15, tThick), trimMat);
            t1.position.set(0, 0.25, -depth/2 + tThick/2);
            const t2 = new THREE.Mesh(new THREE.BoxGeometry(width, 0.15, tThick), trimMat);
            t2.position.set(0, 0.25, depth/2 - tThick/2);
            const t3 = new THREE.Mesh(new THREE.BoxGeometry(tThick, 0.15, depth), trimMat);
            t3.position.set(-width/2 + tThick/2, 0.25, 0);
            const t4 = new THREE.Mesh(new THREE.BoxGeometry(tThick, 0.15, depth), trimMat);
            t4.position.set(width/2 - tThick/2, 0.25, 0);
            group.add(t1, t2, t3, t4);

            const hw = width/2 - 0.5;
            const hd = depth/2 - 0.5;
            for(let i=0; i<4; i++) {
                const h = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 1.5), hazardMat);
                h.position.set(i%2===0 ? -hw : hw, 0.3, i<2 ? -hd : hd);
                group.add(h);
            }

            levelGroup.add(group);

            const collider = new THREE.Mesh(new THREE.BoxGeometry(width, 1, depth));
            collider.position.set(x, y + 0.2, z); 
            collider.visible = false;
            collider.userData = {
                type: 'platform', x, y, z, width, depth,
                topSurfaceY: y + 0.4, group: group, isMoving: false, isSliding: false
            };
            collidables.push(collider);
            return collider;
        }

        function buildPrism(x, y, z, width, depth) {
            const group = new THREE.Group();
            group.position.set(x, y, z);
            
            const walls = new THREE.Mesh(new THREE.BoxGeometry(width, 15, depth), wallMat);
            walls.position.y = -7.5;
            walls.castShadow = true;
            group.add(walls);

            const shape = new THREE.Shape();
            shape.moveTo(-width/2, 0);
            shape.lineTo(width/2, 0);
            shape.lineTo(0, width/2);
            shape.lineTo(-width/2, 0);
            
            const extrudeSettings = { depth: depth, bevelEnabled: false };
            const roofGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            roofGeo.translate(0, 0, -depth/2);
            
            const roof = new THREE.Mesh(roofGeo, baseMat);
            roof.position.y = 0;
            roof.castShadow = true;
            roof.receiveShadow = true;
            group.add(roof);

            levelGroup.add(group);

            const collider = new THREE.Mesh(new THREE.BoxGeometry(width, 2, depth));
            collider.position.set(x, y + 0.5, z);
            collider.visible = false;
            collider.userData = {
                type: 'prism', x, y, z, width, depth,
                topSurfaceY: y + (width/2), group: group, isSliding: true
            };
            collidables.push(collider);
            return collider;
        }

        function buildMoving(x, y, z, width, depth, moveY) {
            const col = buildPlatform(x, y, z, width, depth);
            col.userData.type = 'moving';
            col.userData.isMoving = true;
            col.userData.startY = y;
            col.userData.moveY = moveY;
            movingPlatforms.push(col);
            return col;
        }

        function buildSpike(x, y, z) {
            const geo = new THREE.ConeGeometry(0.4, 1.2, 8);
            const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.5, roughness: 0.2 }));
            mesh.position.set(x, y + 0.6, z);
            mesh.castShadow = true;
            levelGroup.add(mesh);
            mesh.userData = { type: 'spike', x, y: y, z, radius: 0.6 };
            spikes.push(mesh);
        }

                function buildLava(x, y, z) {
            const geo = new THREE.BoxGeometry(6, 0.2, 6);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff4400, emissive: 0xaa2200 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y + 0.1, z);
            levelGroup.add(mesh);
            mesh.userData = { type: 'lava', x, y, z, width: 6, depth: 6 };
            collidables.push(mesh);
        }

                function buildLaser(x, y, z, isHorizontal = false, interval = 0, lengthScale = 1) {
            const geo = new THREE.CylinderGeometry(0.3, 0.3, 20, 8); 
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.9 });
            const mesh = new THREE.Mesh(geo, mat);
            
            // Add the glowing light effect
            const glowLight = new THREE.PointLight(0xff0000, 2, 25);
            mesh.add(glowLight);
            
            mesh.scale.y = lengthScale; // Stretch it based on the data
            
            if (isHorizontal) {
                mesh.rotation.z = Math.PI / 2;
                mesh.position.set(x, y + 0.6, z);
                // Bases removed!
            } else {
                mesh.position.set(x, y + 10, z);
            }

            levelGroup.add(mesh);
            mesh.userData = { 
                type: isHorizontal ? 'laser_h' : 'laser', 
                x, y, z, 
                interval: interval, 
                initialRotation: isHorizontal ? Math.PI/2 : 0,
                lengthScale: lengthScale // Store it for reference
            };
            spikes.push(mesh);
            return mesh;
        }

        function buildLootbox(x, y, z, isCollected = false) {
            // If it's already been eaten, don't spawn it in the editor!
            if (isCollected) return; 

            const group = new THREE.Group();
            group.position.set(x, y, z); 
            
            if (lootboxModel) {
                const clone = lootboxModel.clone();
                const box = new THREE.Box3().setFromObject(clone);
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                
                if (maxDim > 0) {
                    const scale = 1.5 / maxDim;
                    clone.scale.set(scale, scale, scale);
                } else {
                    clone.scale.set(0.05, 0.05, 0.05);
                }
                
                clone.position.y = 0.75;
                group.add(clone);
            } else {
                const mat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
                const box = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
                box.position.y = 0.5; 
                group.add(box);
            }
            
            levelGroup.add(group);
            group.userData = { type: 'lootbox', x, y, z, active: true, group };
        }

        // --- REBUILD LEVEL FROM DATA ---
                function rebuildLevel() {
            while(levelGroup.children.length > 0) levelGroup.remove(levelGroup.children[0]);
            collidables.length = 0; blinkingPlatforms.length = 0; movingPlatforms.length = 0; spikes.length = 0;

            levelData.forEach(obj => {
                if (obj.type === 'platform') buildPlatform(obj.x, obj.y, obj.z, obj.w, obj.d);
                if (obj.type === 'prism') buildPrism(obj.x, obj.y, obj.z, obj.w, obj.d);
                if (obj.type === 'moving') buildMoving(obj.x, obj.y, obj.z, obj.w, obj.d, obj.moveY || 16);
                if (obj.type === 'spike') buildSpike(obj.x, obj.y, obj.z);
                if (obj.type === 'lava') buildLava(obj.x, obj.y, obj.z);
                if (obj.type === 'laser') {
                    const mesh = buildLaser(obj.x, obj.y, obj.z, false, obj.interval || 0, obj.lengthScale || 1);
                    mesh.userData.objData = obj;
                }
                if (obj.type === 'laser_h') {
                    const mesh = buildLaser(obj.x, obj.y, obj.z, true, obj.interval || 0, obj.lengthScale || 1);
                    mesh.userData.objData = obj;
                }
                if (obj.type === 'lootbox') buildLootbox(obj.x, obj.y, obj.z, obj.collected);
                if (obj.type === 'custom') {
                    const color = new THREE.Color(`rgb(${obj.r||255},${obj.g||255},${obj.b||255})`);
                    const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 });
                    
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(obj.w || 4, obj.h || 0.2, obj.d || 4), mat);
                    mesh.position.set(obj.x, obj.y, obj.z);
                    
                    if (obj.rotX) mesh.rotation.x = obj.rotX;
                    if (obj.rotY) mesh.rotation.y = obj.rotY;
                    if (obj.rotZ) mesh.rotation.z = obj.rotZ;
                    
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;
                    mesh.userData = {
                        type: 'custom', objData: obj, startY: obj.y, startX: obj.x,
                        moveY: obj.moveY || 0, moveX: obj.moveX || 0,
                        platformType: obj.platformType || 'normal',
                        timer: 0, isActive: true, mesh: mesh, mat: mat
                    };
                    levelGroup.add(mesh);
                    collidables.push(mesh);
                }
            });

            // Re-attach Transform Controls if a platform was selected
            if (selectedCustomMesh) {
                const objData = selectedCustomMesh.userData.objData;
                const newMesh = levelGroup.children.find(c => c.userData.objData === objData);
                if (newMesh) {
                    selectedCustomMesh = newMesh;
                    transformControls.attach(newMesh);
                } else {
                    selectedCustomMesh = null;
                    transformControls.detach();
                    transformControls.visible = false;
                    propsPanel.style.display = 'none';
                    ghostMesh.visible = true;
                }
            }

            if (!isReadOnly && obbySocket && obbySocket.readyState === 1) {
                obbySocket.send(JSON.stringify({ type: 'obby-level', levelData: levelData }));
            }
        }

        // --- DEFAULT STARTING LEVEL ---
        levelData = [
            { type: 'platform', x: 0, y: 0, z: 0, w: 12, d: 12 },
            { type: 'platform', x: 0, y: 0, z: -12, w: 6, d: 6 },
            { type: 'prism', x: -7, y: 0, z: -24, w: 6, d: 8 },
            { type: 'moving', x: 8, y: 0, z: -22, w: 5, d: 5, moveY: 16 },
            { type: 'platform', x: 0, y: 8, z: -32, w: 6, d: 6 }
        ];
        
        // Try to load from local storage
        const saved = localStorage.getItem('obbyLevel');
        if (saved) { try { levelData = JSON.parse(saved); } catch(e){} }

        // ==========================================
        // 6. EDITOR LOGIC
        // ==========================================
        let selectedTool = 'platform';
        const editorUI = document.getElementById('editor-ui');
        const editorHint = document.getElementById('editor-hint');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0); // Ground plane for raycasting
        const cursorPos = new THREE.Vector3();
        let ghostMesh = null;

        // Editor state
        let editorYaw = 0;
        let editorPitch = 0.9;
        let selectedCustomMesh = null;
        let laserBlinkInterval = 0;

        // Transform Controls (The 3D Arrows)
        const transformControls = new THREE.TransformControls(camera, renderer.domElement);
        transformControls.setSize(0.5);
        transformControls.visible = false;
        scene.add(transformControls);

        transformControls.addEventListener('dragging-changed', function (event) {
            keys.w = keys.a = keys.s = keys.d = false; 
            if (!event.value && !isReadOnly && obbySocket && obbySocket.readyState === 1) {
                obbySocket.send(JSON.stringify({ type: 'obby-level', levelData: levelData }));
            }
        });

                transformControls.addEventListener('objectChange', function () {
            if (selectedCustomMesh) {

                // --- LASER STRETCH LOGIC ---
                if (selectedCustomMesh.userData.type === 'laser' || selectedCustomMesh.userData.type === 'laser_h') {
                    selectedCustomMesh.scale.y = Math.max(0.1, selectedCustomMesh.scale.y);
                    const data = selectedCustomMesh.userData.objData;
                    if (data) {
                        data.lengthScale = selectedCustomMesh.scale.y;
                        if (!isReadOnly && obbySocket && obbySocket.readyState === 1) {
                            obbySocket.send(JSON.stringify({ type: 'obby-level', levelData: levelData }));
                        }
                    }
                    return; // Skip custom platform logic
                }

                // --- CUSTOM PLATFORM LOGIC (Untouched, exactly as you had it) ---
                selectedCustomMesh.scale.x = Math.max(0.1, selectedCustomMesh.scale.x);
                selectedCustomMesh.scale.y = Math.max(0.1, selectedCustomMesh.scale.y);
                selectedCustomMesh.scale.z = Math.max(0.1, selectedCustomMesh.scale.z);

                const data = selectedCustomMesh.userData.objData;
                
                data.x = selectedCustomMesh.position.x;
                data.y = selectedCustomMesh.position.y;
                data.z = selectedCustomMesh.position.z;
                selectedCustomMesh.userData.startX = data.x;
                selectedCustomMesh.userData.startY = data.y;
                
                data.w = 4 * selectedCustomMesh.scale.x;
                data.h = 0.2 * selectedCustomMesh.scale.y;
                data.d = 4 * selectedCustomMesh.scale.z;

                data.rotX = selectedCustomMesh.rotation.x;
                data.rotY = selectedCustomMesh.rotation.y;
                data.rotZ = selectedCustomMesh.rotation.z;
            }
        });

        // UI Elements
        const propsPanel = document.getElementById('props-panel');
        const laserModal = document.getElementById('laser-modal');

        // Tool buttons
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const type = btn.getAttribute('data-type');
                
                if (type === 'custom') {
                    // Spawn directly in front of the camera
                    const spawnX = cameraTarget.x;
                    const spawnZ = cameraTarget.z - 5; // Slightly ahead
                    const spawnY = 2;
                    
                    levelData.push({ 
                        type: 'custom', name: 'platform1', x: spawnX, y: spawnY, z: spawnZ, 
                        w: 4, h: 0.2, d: 4, r: 255, g: 255, b: 255, moveX: 0, moveY: 0, platformType: 'normal' 
                    });
                    rebuildLevel();
                    
                    // Auto-select it
                    const lastObj = levelData[levelData.length - 1];
                    const mesh = levelGroup.children.find(c => c.userData.objData === lastObj);
                    if (mesh) {
                        selectedCustomMesh = mesh;
                        transformControls.attach(mesh);
                        transformControls.visible = true;
                        ghostMesh.visible = false;
                        propsPanel.style.display = 'flex';
                    }
                    
                    // Reset tool so clicking elsewhere doesn't spawn more
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                    selectedTool = 'platform'; // default back to platform
                    return;
                }
                
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedTool = type;
                updateGhost();
            });
        });

                function toggleEditor() {
            isEditorMode = !isEditorMode;
            editorUI.style.display = isEditorMode ? 'flex' : 'none';
            editorHint.style.display = isEditorMode ? 'block' : 'none';
            gridHelper.visible = isEditorMode;
            
            if (isEditorMode) {
                isDead = false;
                document.getElementById('death-screen').style.display = 'none';
                // Setup Editor Camera
                editorYaw = 0;
                editorPitch = 0.9;
                cameraTarget.set(0, 0, 0); // Reset center
                camera.position.set(0, 20, 20);
                camera.lookAt(0, 0, 0);
                updateGhost();
            } else {
                // Reset player and camera
                playerGroup.position.set(0, 2, 0);
                velocity.set(0,0,0);
                transformControls.detach();
                propsPanel.style.display = 'none';
                selectedCustomMesh = null;
                ghostMesh.visible = true;
            }
        }

        function updateGhost() {
            if (ghostMesh) scene.remove(ghostMesh);
            if (!isEditorMode) return;
            
            let geo;
            if (selectedTool === 'lootbox') {
                geo = new THREE.BoxGeometry(1, 1, 1); // Cube for lootbox
            } else {
                geo = new THREE.BoxGeometry(2, 0.2, 2); // Flat slab for others
            }
            
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5, wireframe: true });
            ghostMesh = new THREE.Mesh(geo, mat);
            scene.add(ghostMesh);
        }

        function isOverlapping(x, z) {
            // Lootboxes can be placed anywhere, even inside platforms
            if (selectedTool === 'lootbox') return false;

            const isHazard = (selectedTool === 'spike' || selectedTool === 'laser' || selectedTool === 'lava');
            
            for (let i = 0; i < levelData.length; i++) {
                const obj = levelData[i];
                const objIsHazard = (obj.type === 'spike' || obj.type === 'laser' || obj.type === 'lava');
                
                // If we are placing a hazard, we only care about hitting other hazards
                // If we are placing a platform, we only care about hitting other platforms
                if (isHazard !== objIsHazard) continue;

                const w = obj.w || 3;
                const d = obj.d || 3;
                if (Math.abs(x - obj.x) < (w/2 + 1) && Math.abs(z - obj.z) < (d/2 + 1)) {
                    return true;
                }
            }
            return false;
        }

        window.addEventListener('mousemove', (e) => {
            if (!isEditorMode) return;
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            if (raycaster.ray.intersectPlane(plane, cursorPos)) {
                cursorPos.x = Math.round(cursorPos.x / 2) * 2;
                cursorPos.z = Math.round(cursorPos.z / 2) * 2;
                
                // --- NEW: Find the highest platform below the cursor to snap to ---
                let snapY = 0;
                for (let i = 0; i < levelData.length; i++) {
                    const obj = levelData[i];
                    const isHazard = (obj.type === 'spike' || obj.type === 'laser' || obj.type === 'lava');
                    if (isHazard) continue;
                    
                    const w = obj.w || 6;
                    const d = obj.d || 6;
                    if (Math.abs(cursorPos.x - obj.x) <= w/2 && Math.abs(cursorPos.z - obj.z) <= d/2) {
                        if (obj.y + 0.4 > snapY) snapY = obj.y + 0.4;
                    }
                }
                cursorPos.y = snapY; // Update Y position for placement
                
                if (ghostMesh) {
                    ghostMesh.position.set(cursorPos.x, snapY + 0.1, cursorPos.z);
                    // Change color based on overlap
                    if (isOverlapping(cursorPos.x, cursorPos.z)) {
                        ghostMesh.material.color.setHex(0xff0000); // Red (Blocked)
                    } else {
                        ghostMesh.material.color.setHex(0x00ff00); // Green (Can place)
                    }
                }
            }
        });

                window.addEventListener('mousedown', (e) => {
            if (!isEditorMode) return;
            
            // STOP if clicking on the UI panels
            if (e.target.closest('#editor-ui') || e.target.closest('#props-panel') || e.target.closest('#laser-modal')) return;

            // STOP if clicking on the 3D Arrows/Boxes gizmo
            if (transformControls.axis !== null) return;

            // Raycast for selecting Custom Platforms
                        if (e.button === 0) {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                
                const intersects = raycaster.intersectObjects(levelGroup.children, true);
                let clickedCustom = null;
                let clickedLaser = null;

                // Raycast for both Custom Platforms and Lasers
                for (let hit of intersects) {
                    if (hit.object.userData.type === 'custom' || (hit.object.parent && hit.object.parent.userData.type === 'custom')) {
                        clickedCustom = hit.object.userData.type === 'custom' ? hit.object : hit.object.parent;
                        break;
                    }
                    if (hit.object.userData.type === 'laser' || hit.object.userData.type === 'laser_h') {
                        clickedLaser = hit.object;
                        break;
                    }
                }

                // --- LASER SELECTION ---
                if (clickedLaser) {
                    selectedCustomMesh = clickedLaser;
                    transformControls.attach(selectedCustomMesh);
                    transformControls.visible = true;
                    transformControls.setMode('scale'); 
                    transformControls.setSpace('local'); 
                    transformControls.showX = false;
                    transformControls.showY = true;
                    transformControls.showZ = false;
                    propsPanel.style.display = 'none';
                    ghostMesh.visible = false;
                    return;
                }

                // --- CUSTOM PLATFORM SELECTION ---
                if (clickedCustom) {
                    selectedCustomMesh = clickedCustom;
                    transformControls.attach(selectedCustomMesh);
                    transformControls.visible = true;
                    ghostMesh.visible = false;
                    
                    // RESET ARROWS BACK TO TRANSLATE (Prevents custom platforms from stretching!)
                    transformControls.setMode('translate');
                    transformControls.setSpace('world');
                    transformControls.showX = true;
                    transformControls.showY = true;
                    transformControls.showZ = true;
                    
                    // Load data into UI
                    const data = selectedCustomMesh.userData.objData;
                    document.getElementById('prop-name').value = data.name || 'platform1';
                    document.getElementById('prop-r').value = data.r || 255;
                    document.getElementById('prop-g').value = data.g || 255;
                    document.getElementById('prop-b').value = data.b || 255;
                    document.getElementById('val-r').innerText = data.r || 255;
                    document.getElementById('val-g').innerText = data.g || 255;
                    document.getElementById('val-b').innerText = data.b || 255;
                    document.getElementById('prop-moveY').value = data.moveY || 0;
                    document.getElementById('prop-moveY-slider').value = data.moveY || 0;
                    document.getElementById('prop-moveX').value = data.moveX || 0;
                    document.getElementById('prop-moveX-slider').value = data.moveX || 0;
                    document.getElementById('prop-type').value = data.platformType || 'normal';
                    
                    propsPanel.style.display = 'flex';
                    return;
                } 
                
                // --- DESELECTION (Clicked Empty Space) ---
                else {
                    if (selectedCustomMesh) {
                        selectedCustomMesh = null;
                        transformControls.detach();
                        transformControls.visible = false;
                        propsPanel.style.display = 'none';
                        ghostMesh.visible = true;
                        
                        // Reset arrows for next time
                        transformControls.setMode('translate');
                        transformControls.setSpace('world');
                        transformControls.showX = true;
                        transformControls.showY = true;
                        transformControls.showZ = true;
                    }
                }
                
                // Standard placement
                if (isOverlapping(cursorPos.x, cursorPos.z)) return; 
                
                if (selectedTool === 'custom') {
                    levelData.push({ 
                        type: 'custom', name: 'platform1', x: cursorPos.x, y: cursorPos.y + 2, z: cursorPos.z, 
                        w: 4, h: 0.2, d: 4, r: 255, g: 255, b: 255, moveX: 0, moveY: 0, platformType: 'normal' 
                    });
                }
                if (selectedTool === 'lootbox') levelData.push({ type: 'lootbox', x: cursorPos.x, y: cursorPos.y, z: cursorPos.z });
                if (selectedTool === 'platform') levelData.push({ type: 'platform', x: cursorPos.x, y: cursorPos.y, z: cursorPos.z, w: 6, d: 6 });
                if (selectedTool === 'prism') levelData.push({ type: 'prism', x: cursorPos.x, y: cursorPos.y, z: cursorPos.z, w: 6, d: 8 });
                if (selectedTool === 'moving') levelData.push({ type: 'moving', x: cursorPos.x, y: cursorPos.y, z: cursorPos.z, w: 5, d: 5, moveY: 16 });
                if (selectedTool === 'spike') levelData.push({ type: 'spike', x: cursorPos.x, y: cursorPos.y, z: cursorPos.z });
                if (selectedTool === 'lava') levelData.push({ type: 'lava', x: cursorPos.x, y: cursorPos.y, z: cursorPos.z });
                if (selectedTool === 'laser') levelData.push({ type: 'laser', x: cursorPos.x, y: cursorPos.y, z: cursorPos.z, interval: laserBlinkInterval });
                if (selectedTool === 'laser_h') levelData.push({ type: 'laser_h', x: cursorPos.x, y: cursorPos.y, z: cursorPos.z, interval: laserBlinkInterval });
                
                rebuildLevel();
                
                // Auto-focus new objects
                if (selectedTool === 'custom' || selectedTool === 'laser' || selectedTool === 'laser_h') {
                    const lastObj = levelData[levelData.length - 1];
                    const mesh = levelGroup.children.find(c => c.userData.objData === lastObj);
                    if (mesh) {
                        selectedCustomMesh = mesh;
                        transformControls.attach(mesh);
                        transformControls.visible = true;
                        ghostMesh.visible = false;
                        
                        if (selectedTool === 'custom') {
                            transformControls.setMode('translate');
                            transformControls.setSpace('world');
                            transformControls.showX = true;
                            transformControls.showY = true;
                            transformControls.showZ = true;
                            propsPanel.style.display = 'flex';
                        } else {
                            transformControls.setMode('scale');
                            transformControls.setSpace('local');
                            transformControls.showX = false;
                            transformControls.showY = true;
                            transformControls.showZ = false;
                            propsPanel.style.display = 'none';
                        }
                    }
                }
            } 
            else if (e.button === 2) { // Delete
                if (selectedCustomMesh) {
                    // Delete selected custom platform
                    const index = levelData.findIndex(o => o === selectedCustomMesh.userData.objData);
                    if (index > -1) levelData.splice(index, 1);
                    selectedCustomMesh = null;
                    transformControls.detach();
                    transformControls.visible = false;
                    propsPanel.style.display = 'none';
                    ghostMesh.visible = true;
                    rebuildLevel();
                    return;
                }
                for(let i = levelData.length - 1; i >= 0; i--) {
                    const obj = levelData[i];
                    if (Math.sqrt((obj.x - cursorPos.x)**2 + (obj.z - cursorPos.z)**2) < 4) {
                        levelData.splice(i, 1); rebuildLevel(); break;
                    }
                }
            }

        const cameraTarget = new THREE.Vector3(0, 0, 0);
        
        function updateCamera(delta) {
            if (isEditorMode) {
                const speed = 30 * delta;
                const rotSpeed = 1.5 * delta;
                
                // Arrow keys orbit the camera
                if (keys.up) editorPitch = Math.min(1.5, editorPitch + rotSpeed);
                if (keys.down) editorPitch = Math.max(0.1, editorPitch - rotSpeed);
                if (keys.left) editorYaw += rotSpeed;
                if (keys.right) editorYaw -= rotSpeed;

                // WASD moves the camera target relative to the view
                const forwardX = -Math.sin(editorYaw);
                const forwardZ = -Math.cos(editorYaw);
                const rightX = Math.cos(editorYaw);
                const rightZ = -Math.sin(editorYaw);
                
                if (keys.w) { cameraTarget.x += forwardX * speed; cameraTarget.z += forwardZ * speed; }
                if (keys.s) { cameraTarget.x -= forwardX * speed; cameraTarget.z -= forwardZ * speed; }
                if (keys.a) { cameraTarget.x -= rightX * speed; cameraTarget.z -= rightZ * speed; }
                if (keys.d) { cameraTarget.x += rightX * speed; cameraTarget.z += rightZ * speed; }

                // Calculate camera position based on orbit
                const dist = 40;
                camera.position.x = cameraTarget.x + Math.sin(editorYaw) * Math.cos(editorPitch) * dist;
                camera.position.y = cameraTarget.y + Math.sin(editorPitch) * dist;
                camera.position.z = cameraTarget.z + Math.cos(editorYaw) * Math.cos(editorPitch) * dist;
                
                camera.lookAt(cameraTarget);
            } else {
                const targetX = playerGroup.position.x;
                const targetY = playerGroup.position.y + Math.sin(camPitch) * camDist;
                const targetZ = playerGroup.position.z + Math.cos(camPitch) * camDist;
                
                camera.position.x += (targetX - camera.position.x) * 0.1;
                camera.position.y += (targetY - camera.position.y) * 0.1;
                camera.position.z += (targetZ - camera.position.z) * 0.1;
                
                cameraLookAt.copy(playerGroup.position);
                cameraLookAt.y += 2; cameraLookAt.z -= 4; 
                camera.lookAt(cameraLookAt);
            }
        }

        function fireProjectile(type) {
            let mesh;
            
            // Use the 3D model if it's loaded!
            if (weaponModels[type]) {
                mesh = weaponModels[type].clone();
                // Keep the projectile the same size as the one in your hands
                mesh.scale.set(0.01, 0.01, 0.01); 
                
                // If the model faces the wrong way when flying, adjust this rotation
                mesh.rotation.set(0, 0, 0); 
            } else {
                // Fallback if model isn't loaded yet
                const isNuke = type === 'nuke';
                const geo = isNuke ? new THREE.SphereGeometry(0.5, 16, 16) : new THREE.CylinderGeometry(0.3, 0.3, 0.8, 8);
                const mat = new THREE.MeshStandardMaterial({ color: isNuke ? 0x22aa22 : 0xdd2222 });
                mesh = new THREE.Mesh(geo, mat);
            }
            
            // Spawn from the tip of the weapon based on aimAngle
            const startX = playerGroup.position.x + Math.sin(aimAngle) * weaponOrbitDistance;
            const startY = playerGroup.position.y + 1.0;
            const startZ = playerGroup.position.z + Math.cos(aimAngle) * weaponOrbitDistance;
            mesh.position.set(startX, startY, startZ);
            
            // Rotate the projectile to face the aim direction
            mesh.rotation.y = aimAngle;

            scene.add(mesh);

            const dir = new THREE.Vector3(Math.sin(aimAngle), 0, Math.cos(aimAngle));

            // Broadcast projectile to other players
            if (obbySocket && obbySocket.readyState === 1) {
                obbySocket.send(JSON.stringify({
                    type: 'obby-projectile',
                    projType: type,
                    x: startX, y: startY, z: startZ,
                    dirX: dir.x, dirZ: dir.z
                }));
            }

            activeProjectiles.push({
                mesh, dir, type, 
                speed: type === 'nuke' ? 20 : 30, 
                vy: type === 'nuke' ? 0 : 5, 
                time: performance.now(),
                lastTrail: performance.now()
            });
        }

        function checkCollisions(delta) {
            isGrounded = false;
            const playerX = playerGroup.position.x;
            const playerZ = playerGroup.position.z;
            const feetY = playerGroup.position.y;
            const playerRadius = 0.4;

            collidables.forEach(plat => {

                                if (plat.userData.type === 'custom') {
                    const u = plat.userData;
                    plat.updateMatrixWorld(true);

                    const localPos = plat.worldToLocal(playerGroup.position.clone());
                    const prevWorldPos = new THREE.Vector3(playerGroup.position.x, prevFeetY, playerGroup.position.z);
                    const prevLocalPos = plat.worldToLocal(prevWorldPos.clone());

                    const hw = plat.geometry.parameters.width / 2;
                    const hh = plat.geometry.parameters.height / 2;
                    const hd = plat.geometry.parameters.depth / 2;

                    // Helper: Pushes the player in the platform's LOCAL space (accounts for scale & rotation)
                    const pushLocal = (lx, ly, lz) => {
                        const worldPush = new THREE.Vector3(lx, ly, lz)
                            .applyQuaternion(plat.quaternion)
                            .multiply(plat.scale);
                        playerGroup.position.add(worldPush);
                    };

                    // 1. SWEPT TOP LANDING (Smooth landing from above)
                    if (Math.abs(localPos.x) < hw + 0.4 && Math.abs(localPos.z) < hd + 0.4) {
                        if (velocity.y <= 0 && prevLocalPos.y >= hh - 0.1 && localPos.y <= hh + 0.2) {
                            pushLocal(0, hh - localPos.y, 0);
                            
                            const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(plat.quaternion);
                            if (localUp.y > 0.5) velocity.y = 0;
                            
                            isGrounded = true;
                            
                            if (u.platformType === 'vanishing' || u.platformType === 'explosive') u.timer += delta;
                            if (u.platformType === 'shaking') {
                                u.timer += delta;
                                if (u.timer > 1.5) {
                                    playerGroup.position.x += (Math.random() - 0.5) * 2;
                                    playerGroup.position.z += (Math.random() - 0.5) * 2;
                                    velocity.y = 5;
                                }
                            }
                            return; // Successfully landed, skip AABB pushout
                        }
                    }

                    // 2. SOLID SIDES AND BOTTOM (AABB Pushout)
                    const px1 = localPos.x - 0.4, px2 = localPos.x + 0.4;
                    const py1 = localPos.y,       py2 = localPos.y + 2.8;
                    const pz1 = localPos.z - 0.4, pz2 = localPos.z + 0.4;

                    const bx1 = -hw, bx2 = hw;
                    const by1 = -hh, by2 = hh;
                    const bz1 = -hd, bz2 = hd;

                    const ox = Math.min(px2, bx2) - Math.max(px1, bx1);
                    const oy = Math.min(py2, by2) - Math.max(py1, by1);
                    const oz = Math.min(pz2, bz2) - Math.max(pz1, bz1);

                    if (ox > 0 && oy > 0 && oz > 0) {
                        // If falling and clipping the edge/corner, push UP to the surface
                        if (velocity.y <= 0 && prevLocalPos.y >= hh - 0.2) {
                            pushLocal(0, hh - localPos.y, 0);
                            const localUp = new THREE.Vector3(0, 1, 0).applyQuaternion(plat.quaternion);
                            if (localUp.y > 0.5) velocity.y = 0;
                            isGrounded = true;
                        }
                        // If hitting the bottom (head bump)
                        else if (prevLocalPos.y < -hh && oy < ox * 0.5 && oy < oz * 0.5) {
                            pushLocal(0, -oy, 0);
                            velocity.y = 0;
                        } else {
                            // Side collision. Push out on X or Z, whichever is smaller
                            if (ox < oz) {
                                const sign = localPos.x > 0 ? 1 : -1;
                                pushLocal(ox * sign, 0, 0);
                            } else {
                                const sign = localPos.z > 0 ? 1 : -1;
                                pushLocal(0, 0, oz * sign);
                            }
                        }
                    }
                    return;
                }

                if (plat.userData.type === 'lava') {
                    if (Math.abs(playerX - plat.userData.x) < 3 && Math.abs(playerZ - plat.userData.z) < 3 && playerGroup.position.y < plat.userData.y + 1) {
                        die();
                    }
                    return; // Skip standard platform collision for lava
                }

                if (!plat.userData.group.visible) return;

                const pX = plat.userData.group.position.x;
                const pZ = plat.userData.group.position.z;
                const pW = plat.userData.width / 2;
                const pD = plat.userData.depth / 2;
                let platformTop = plat.userData.isMoving ? plat.userData.group.position.y + 0.4 : plat.userData.topSurfaceY;
                
                // If it's a prism, calculate the exact height of the slope based on your X position
                if (plat.userData.type === 'prism') {
                    const dx = playerX - pX;
                    const clampedDx = Math.max(-pW, Math.min(pW, dx));
                    platformTop = plat.userData.y + (pW - Math.abs(clampedDx));
                }

                const isOverX = playerX > pX - pW - playerRadius && playerX < pX + pW + playerRadius;
                const isOverZ = playerZ > pZ - pD - playerRadius && playerZ < pZ + pD + playerRadius;

                if (isOverX && isOverZ) {
                    // Landing
                    if (velocity.y <= 0 && prevFeetY >= platformTop - 0.1 && feetY <= platformTop + 0.2) {
                        playerGroup.position.y = platformTop;
                        velocity.y = 0;
                        isGrounded = true;

                        if (plat.userData.isMoving) playerGroup.position.y += plat.userData.velocityY * delta;

                        if (plat.userData.isSliding) {
                            // Tilt the player sideways to match the slope
                            const slopeDir = Math.sign(playerGroup.position.x - pX);
                            playerGroup.rotation.z = slopeDir * 0.45; // 45 degree tilt
                            
                            // Slide the player forward like a boost
                            playerGroup.position.z -= 15 * delta; 
                        } else {
                            // Stand straight up if on a flat platform
                            playerGroup.rotation.z = 0;
                        }
                    }
                    // Sides
                    else if (feetY < platformTop - 0.2 && playerGroup.position.y + 2.8 > plat.userData.group.position.y - 15) {
                        const dx = playerX - pX;
                        const dz = playerZ - pZ;
                        const overlapX = (pW + playerRadius) - Math.abs(dx);
                        const overlapZ = (pD + playerRadius) - Math.abs(dz);
                        
                        if (overlapX < overlapZ) playerGroup.position.x += Math.sign(dx) * overlapX;
                        else playerGroup.position.z += Math.sign(dz) * overlapZ;
                    }
                }
            });

            // Spikes & Lasers
            spikes.forEach(spike => {
                const dist = Math.sqrt(
                    Math.pow(playerGroup.position.x - spike.userData.x, 2) + 
                    Math.pow(playerGroup.position.z - spike.userData.z, 2)
                );
                
                if (spike.userData.type === 'laser') {
                    // Laser is a tall infinite shaft
                    if (dist < 0.7) die();
                } else {
                    // Normal Spike
                    if (dist < 0.7) {
                        const spikeBaseY = spike.userData.y + 0.0;
                        const spikeTipY = spike.userData.y + 1.2;
                        const playerFeetY = playerGroup.position.y;
                        const playerHeadY = playerGroup.position.y + 2.8;
                        if (playerFeetY <= spikeTipY && playerHeadY >= spikeBaseY) die();
                    }
                }
            });

            if (playerGroup.position.y < -30) die();
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Stop rendering if on home screen
            if (!isPlaying && !isEditorMode) return;

            if (isPaused) {

            } else {
                pauseCounter = 0;
            }

            if (isDead) return;

            const delta = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            if (!isEditorMode && !isPaused) {
                prevFeetY = playerGroup.position.y;

                if (isGrounded) coyoteTime = 0.15; 
                else coyoteTime -= delta;

                // Movement
                let moveX = 0;
                let moveZ = 0;
                if (keys.w) moveZ -= 1;
                if (keys.s) moveZ += 1;
                if (keys.a) moveX -= 1;
                if (keys.d) moveX += 1;
                // NEW: Aiming with Arrow Keys
                if (keys.left) aimAngle -= aimRotSpeed * delta;   // Counter-Clockwise
                if (keys.right) aimAngle += aimRotSpeed * delta;  // Clockwise

                

                const isMoving = (moveX !== 0 || moveZ !== 0);

                    moveX /= length;

                    playerGroup.position.x += moveX * moveSpeed * delta;
                    playerGroup.position.z += moveZ * moveSpeed * delta;

                    const targetRotation = Math.atan2(moveX, moveZ);
                    let diff = targetRotation - playerGroup.rotation.y;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;
                    playerGroup.rotation.y += diff * 15 * delta;

                    walkTime += delta * 15;
                    body.position.y = Math.abs(Math.sin(walkTime * 2)) * 0.15;
                    body.rotation.x = Math.sin(walkTime) * 0.08;
                } else {
                    body.position.y = 0;
                    body.rotation.x = 0;
                }
                
                // Reset tilt if we aren't grounded on a prism
                if (!isGrounded) playerGroup.rotation.z = 0;

                // Jump
                if (keys.space && coyoteTime > 0 && canJump) {
                    coyoteTime = 0;
                    velocity.y = jumpForce;
                    canJump = false;
                }
                if (!keys.space) canJump = true;

                velocity.y += gravity * delta;
                playerGroup.position.y += velocity.y * delta;

                // --- PLAYER VS PLAYER COLLISIONS ---
                remotePlayers.forEach((data) => {
                    if (!data.group) return;
                    
                    const dx = playerGroup.position.x - data.group.position.x;
                    const dz = playerGroup.position.z - data.group.position.z;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    const dy = Math.abs(playerGroup.position.y - data.group.position.y);
                    
                    // Reduced hitbox to 0.8 (allows you to slightly overlap by 0.2px)
                    const COMBINED_RADIUS = 0.8;
                    
                    if (dist < COMBINED_RADIUS && dist > 0.01 && dy < 2.5) {
                        const overlap = COMBINED_RADIUS - dist;
                        const nx = dx / dist; 
                        const nz = dz / dist; 
                        
                        // Calculate how fast you are moving into them (the impact force)
                        const impactSpeed = Math.abs((moveX * nx) + (moveZ * nz));
                        
                        // 1. SQUISH: Softly push yourself back out (max 50% per frame)
                        playerGroup.position.x += nx * overlap * 0.5;
                        playerGroup.position.z += nz * overlap * 0.5;
                        
                        // 2. BUDGE: Push the other player visually.
                        // If you bang into them (impactSpeed > 0.5), they get pushed back quickly.
                        // If you slowly lean in, they get pushed slowly.
                        const pushForce = (impactSpeed * 0.15) + 0.02; 
                        
                        data.visualOffset.x -= nx * overlap * pushForce;
                        data.visualOffset.z -= nz * overlap * pushForce;
                        
                        // Clamp the visual push so they don't fly into the void
                        data.visualOffset.x = Math.max(-2, Math.min(2, data.visualOffset.x));
                        data.visualOffset.z = Math.max(-2, Math.min(2, data.visualOffset.z));
                    }
                });
                // -----------------------------------

                checkCollisions(delta);

                                // --- WEAPON & COMBAT LOGIC ---

                            // (Keep the lines above this that select the weapon and update visuals)

                                // 2. Update Projectiles
                for (let i = activeProjectiles.length - 1; i >= 0; i--) {

                    p.mesh.position.z += p.dir.z * p.speed * delta;
                    p.mesh.position.y += p.vy * delta;
                    if (p.type === 'lob') p.vy -= 20 * delta; // Gravity for lob
                    
                                                            // Nuke Trail (Thick Smoke)
                    if (p.type === 'nuke' && performance.now() - p.lastTrail > 25) {
                        p.lastTrail = performance.now();
                        
                        const trailMat = new THREE.MeshBasicMaterial({ 
                            color: 0xdddddd,
                            transparent: true, 
                            opacity: 0.8
                        });
                        
                        // Much bigger starting size so you can actually see it
                        const trail = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), trailMat);
                        trail.position.copy(p.mesh.position);
                        
                        // Add slight random offset so it looks like a cloud, not a perfect line
                        trail.position.x += (Math.random() - 0.5) * 0.2;
                        trail.position.y += (Math.random() - 0.5) * 0.2;
                        trail.position.z += (Math.random() - 0.5) * 0.2;
                        
                        scene.add(trail);
                        
                        let scale = 1;

                            scale += 0.1;

                    if (!hitPlayer) {

                        const pVel = p.dir.clone().multiplyScalar(p.speed).add(new THREE.Vector3(0, p.vy, 0));
                        const pDist = pVel.length();
                        
                        if (pDist > 0) {
                            const pRay = new THREE.Raycaster();
                            pRay.set(p.mesh.position, pVel.clone().normalize());
                            
                            // Look ahead by 2 frames so fast nukes can't skip through thin platforms
                            pRay.far = pDist * delta * 2; 
                            
                            // Check against all level visuals (platforms, lava, etc.)
                            const platformHits = pRay.intersectObjects(levelGroup.children, true);
                            if (platformHits.length > 0) {

                                p.mesh.position.copy(platformHits[0].point);

                        }
                    }

                    // Collision / Explosion (now includes platforms!)
                    if (p.mesh.position.y < 0 || performance.now() - p.time > 3000 || hitPlayer || hitPlatform) {
                        // Explosion Bubble
                        const expMat = new THREE.MeshBasicMaterial({ color: p.type === 'nuke' ? 0x22aa22 : 0xffaa00, transparent: true, opacity: 1 });
                        const explosion = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), expMat);
                        explosion.position.copy(p.mesh.position);

                        // Send damage to anyone in the blast radius
                        if (p.type === 'nuke') {
                            remotePlayers.forEach((rp, id) => {
                                if (p.mesh.position.distanceTo(rp.group.position) < 15) { // 15 unit blast radius
                                    obbySocket.send(JSON.stringify({ type: 'obby-damage', targetId: id, amount: 100 })); // 100 damage = instant death
                                }
                            });
                            
                            // If the projectile was remote, check if WE got hit
                            if (p.isRemote && playerGroup.position.distanceTo(p.mesh.position) < 15) {

                                    localHealth = 100; // Reset health for respawn
                                }
                            }
                        }

                        let expSize = 1;
                        const expInterval = setInterval(() => {
                            expSize += 1.5;
                            explosion.scale.set(expSize, expSize, expSize);
                            explosion.material.opacity -= 0.05;
                            if (explosion.material.opacity <= 0) {
                                clearInterval(expInterval);
                                scene.remove(explosion);
                            }
                        }, 20);
                        
                        scene.remove(p.mesh);
                        activeProjectiles.splice(i, 1);
                    }
                }
                
                // 3. Check Placed Mines
                for (let i = placedMines.length - 1; i >= 0; i--) {
                    const m = placedMines[i];
                    if (performance.now() - m.time > 60000) {
                        scene.remove(m.mesh);
                        placedMines.splice(i, 1);
                        continue;
                    }
                    remotePlayers.forEach(rp => {
                        if (rp.group.position.distanceTo(m.mesh.position) < 1.5) {
                            scene.remove(m.mesh);
                            placedMines.splice(i, 1);
                        }
                    });
                }
            }

            // Rotate active Spiky Go-Round
            if (playerGroup.getObjectByName("SpikyRing")) {
                playerGroup.getObjectByName("SpikyRing").rotation.y += delta * 5;
            }

            // --- ANIMATE REMOTE PLAYERS ---
            remotePlayers.forEach((data) => {
                const group = data.group;
                const body = data.body;
                
                // 1. Decay the visual push (springs back smoothly)
                data.visualOffset.x *= 0.85;
                data.visualOffset.z *= 0.85;
                if (Math.abs(data.visualOffset.x) < 0.01) data.visualOffset.x = 0;
                if (Math.abs(data.visualOffset.z) < 0.01) data.visualOffset.z = 0;

                // 2. Network Position + Visual Push
                const targetX = data.targetX + data.visualOffset.x;
                const targetZ = data.targetZ + data.visualOffset.z;
                
                const dx = targetX - group.position.x;
                const dy = data.targetY - group.position.y;
                const dz = targetZ - group.position.z;
                
                group.position.x += dx * 0.5;
                group.position.y += dy * 0.5;
                group.position.z += dz * 0.5;
                
                // Smooth rotation
                let rotDiff = data.targetRot - group.rotation.y;
                while (rotDiff < -Math.PI) rotDiff += Math.PI * 2;
                while (rotDiff > Math.PI) rotDiff -= Math.PI * 2;
                group.rotation.y += rotDiff * 0.5;

                // NEW: Smooth Aim Rotation for their weapon
                if (data.targetAim !== undefined && data.currentAim !== undefined) {
                    let aimDiff = data.targetAim - data.currentAim;
                    while (aimDiff < -Math.PI) aimDiff += Math.PI * 2;
                    while (aimDiff > Math.PI) aimDiff -= Math.PI * 2;
                    data.currentAim += aimDiff * 0.5;
                    
                    if (data.weaponGroup) {
                        data.weaponGroup.rotation.y = data.currentAim - group.rotation.y;
                    }
                }
                
                // 3. Apply Wobble Animation
                // Check their *actual* network movement, not the visual push
                const netDx = data.targetX - group.position.x;
                const netDz = data.targetZ - group.position.z;
                const netDist = Math.sqrt(netDx * netDx + netDz * netDz);

                        // Platform animations

                plat.userData.velocityY = Math.cos(syncTime * 1.5) * (plat.userData.moveY / 2) * 1.5;
                plat.userData.group.position.y = plat.userData.startY + offset;

                    const pulse = (Math.sin(syncTime * 8) + 1) / 2; 
                    
                    // 2. Pulse the material opacity
                    child.material.opacity = 0.4 + (pulse * 0.6);
                    
                    // 3. Pulse the point light intensity for the glow effect
                    if (child.children[0] && child.children[0].isLight) {

                    // 4. Blinking Logic (If the user set an interval, it will blink)

                localStorage.setItem('obbySharedWorlds', JSON.stringify(sharedWorlds));
            } else {
                // Remove from My Games
                projects = projects.filter(p => p.id !== projectToDelete);
                localStorage.setItem('obbyProjects', JSON.stringify(projects));
            }

            document.getElementById('delete-modal').style.display = 'none';
            projectToDelete = null;
            renderHomeScreen(); // Refresh the menu
        });

        animate();
    </script>
</body>
</html>
