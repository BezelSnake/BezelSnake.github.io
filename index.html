        <script>
            // ========== HEX TILE ==========
            let bandScroll = 0;
            let bandlength = 2;
            let hexTileCanvas = null;

            function makeHexTile(hexSpacing, hexSize, blur, hexColor, outlineColor) {
                const HEX_W = hexSpacing * 1.5;
                const HEX_H = hexSpacing * Math.sqrt(3);
                const TW = Math.round(HEX_W * 2);
                const TH = Math.round(HEX_H * 2);
                const c = document.createElement("canvas");
                c.width = TW;
                c.height = TH;
                const cx = c.getContext("2d");
                const drawHexAt = (hx, hy) => {
                    cx.beginPath();
                    for (let v = 0; v < 6; v++) {
                        const a = (v * Math.PI) / 3;
                        const px = hx + hexSize * Math.cos(a);
                        const py = hy + hexSize * Math.sin(a);
                        if (v === 0) cx.moveTo(px, py);
                        else cx.lineTo(px, py);
                    }
                    cx.closePath();
                };
                for (let di = -1; di <= 1; di++) {
                    for (let dj = -1; dj <= 1; dj++) {
                        const offX = di * TW,
                            offY = dj * TH;
                        cx.shadowColor = "rgba(0, 0, 0, 0.95)";
                        cx.shadowBlur = blur;
                        cx.shadowOffsetX = 0;
                        cx.shadowOffsetY = 0;
                        cx.fillStyle = hexColor;
                        for (let col = 0; col <= 2; col++) {
                            const offset = col & 1 ? HEX_H / 2 : 0;
                            for (let row = 0; row <= 2; row++) {
                                drawHexAt(offX + col * HEX_W, offY + row * HEX_H + offset);
                                cx.fill();
                            }
                        }
                        cx.shadowColor = "transparent";
                        cx.shadowBlur = 0;
                        cx.strokeStyle = outlineColor;
                        cx.lineWidth = 2;
                        for (let col = 0; col <= 2; col++) {
                            const offset = col & 1 ? HEX_H / 2 : 0;
                            for (let row = 0; row <= 2; row++) {
                                drawHexAt(offX + col * HEX_W, offY + row * HEX_H + offset);
                                cx.stroke();
                            }
                        }
                    }
                }
                return c;
            }

            // ========== COSMETICS ==========
            const COSMETICS = [
                "none",
                "crown",
                "tophat",
                "bunny",
                "cat",
                "sunglasses",
                "3dglasses",
                "heartglasses",
                "blonde",
                "afro",
                "headphones",
                "goggles",
                "horns",
                "angelwings",
                "bowtie",
                "mustache",
            ];

            const Y_OFFSETS = {
                crown: 1.6,
                tophat: 1.6,
                bunny: 1.6,
                cat: 1.6,
                sunglasses: 0.15,
                "3dglasses": 0.15,
                heartglasses: 0.15,
                blonde: 1.3,
                afro: 1.3,
                headphones: 0.35,
                goggles: 0.15,
                horns: 1.3,
                angelwings: 0.9,
                bowtie: 1.2,
                mustache: 0.6,
            };

            function drawCosmetic(ctx, id, x, y, size, angle, noOffset) {
                if (!id || id === "none") return;
                let ox = 0,
                    oy = 0;
                if (!noOffset) {
                    const yOff = (Y_OFFSETS[id] || 0) * size;
                    const backDir = angle + Math.PI;
                    ox = Math.cos(backDir) * yOff * size;
                    oy = Math.sin(backDir) * yOff * size;
                }
                ctx.save();
                ctx.translate(x + ox, y + oy);
                ctx.rotate(angle);
                const eyeOffset = size * 0.55;
                const eyeAngle = Math.PI / 3;
                const lx = Math.cos(eyeAngle) * eyeOffset;
                const ly = Math.sin(eyeAngle) * eyeOffset;
                const rx = Math.cos(-eyeAngle) * eyeOffset;
                const ry = Math.sin(-eyeAngle) * eyeOffset;
                switch (id) {
                    case "crown": {
                        ctx.strokeStyle = "#e0a800";
                        ctx.lineWidth = size * 0.2;
                        ctx.beginPath();
                        ctx.arc(0, 0, size * 0.65, Math.PI * 1.15, Math.PI * 1.85);
                        ctx.stroke();
                        ctx.fillStyle = "#e0a800";
                        for (let i = 0; i < 5; i++) {
                            const t = i / 4,
                                a = Math.PI * 1.15 + t * Math.PI * 0.7;
                            const px = Math.cos(a) * size * 0.65,
                                py = Math.sin(a) * size * 0.65;
                            ctx.beginPath();
                            ctx.moveTo(px - size * 0.09, py);
                            ctx.lineTo(px + size * 0.09, py);
                            ctx.lineTo(px, py - size * 0.3);
                            ctx.closePath();
                            ctx.fill();
                        }
                        break;
                    }
                    case "tophat": {
                        ctx.fillStyle = "#111111";
                        ctx.beginPath();
                        ctx.ellipse(0, -size * 0.7, size * 0.85, size * 0.2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillRect(-size * 0.55, -size * 1.7, size * 1.1, size);
                        ctx.beginPath();
                        ctx.ellipse(0, -size * 1.7, size * 0.55, size * 0.15, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#cc2244";
                        ctx.fillRect(-size * 0.55, -size * 1.15, size * 1.1, size * 0.18);
                        break;
                    }
                    case "bunny": {
                        ctx.fillStyle = "#ff9ec8";
                        ctx.beginPath();
                        ctx.ellipse(-size * 0.3, -size * 1.1, size * 0.18, size * 0.55, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(size * 0.3, -size * 1.1, size * 0.18, size * 0.55, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#ffc8e0";
                        ctx.beginPath();
                        ctx.ellipse(-size * 0.3, -size * 1.1, size * 0.08, size * 0.4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(size * 0.3, -size * 1.1, size * 0.08, size * 0.4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case "cat": {
                        ctx.fillStyle = "#b080e0";
                        ctx.beginPath();
                        ctx.moveTo(-size * 0.6, -size * 0.4);
                        ctx.lineTo(-size * 0.75, -size * 1.2);
                        ctx.lineTo(-size * 0.2, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(size * 0.6, -size * 0.4);
                        ctx.lineTo(size * 0.75, -size * 1.2);
                        ctx.lineTo(size * 0.2, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    }
                    case "sunglasses": {
                        ctx.fillStyle = "#1a2a4a";
                        ctx.beginPath();
                        ctx.arc(lx, ly, size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(rx, ry, size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = "#1a2a4a";
                        ctx.lineWidth = size * 0.1;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(rx, ry);
                        ctx.stroke();
                        ctx.fillStyle = "rgba(120,180,255,0.35)";
                        ctx.beginPath();
                        ctx.arc(lx - size * 0.1, ly - size * 0.1, size * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(rx - size * 0.1, ry - size * 0.1, size * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case "3dglasses": {
                        ctx.fillStyle = "#dd2222";
                        ctx.beginPath();
                        ctx.arc(lx, ly, size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#2244dd";
                        ctx.beginPath();
                        ctx.arc(rx, ry, size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = "#111";
                        ctx.lineWidth = size * 0.08;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(rx, ry);
                        ctx.stroke();
                        break;
                    }
                    case "heartglasses": {
                        const heart = (hx, hy, s) => {
                            ctx.beginPath();
                            ctx.moveTo(hx, hy + s * 0.6);
                            ctx.bezierCurveTo(
                                hx - s * 1.3,
                                hy - s * 0.5,
                                hx - s * 0.4,
                                hy - s * 1.2,
                                hx,
                                hy - s * 0.35
                            );
                            ctx.bezierCurveTo(hx + s * 0.4, hy - s * 1.2, hx + s * 1.3, hy - s * 0.5, hx, hy + s * 0.6);
                            ctx.closePath();
                            ctx.fill();
                        };
                        ctx.fillStyle = "#ff66aa";
                        heart(lx, ly, size * 0.35);
                        heart(rx, ry, size * 0.35);
                        ctx.strokeStyle = "#ff66aa";
                        ctx.lineWidth = size * 0.08;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(rx, ry);
                        ctx.stroke();
                        break;
                    }
                    case "blonde": {
                        ctx.fillStyle = "#e8c850";
                        ctx.beginPath();
                        ctx.arc(0, -size * 0.15, size * 1.0, Math.PI * 1.05, Math.PI * 1.95);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = "#d4b040";
                        ctx.beginPath();
                        ctx.ellipse(0, -size * 0.15, size * 1.0, size * 0.3, 0, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case "afro": {
                        ctx.fillStyle = "#cc5522";
                        for (let i = 0; i < 10; i++) {
                            const a = (i / 10) * Math.PI * 2,
                                r = size * 1.1;
                            ctx.beginPath();
                            ctx.arc(
                                Math.cos(a) * r * 0.7,
                                Math.sin(a) * r * 0.7 - size * 0.15,
                                size * 0.5,
                                0,
                                Math.PI * 2
                            );
                            ctx.fill();
                        }
                        break;
                    }
                    case "headphones": {
                        ctx.strokeStyle = "#cc6622";
                        ctx.lineWidth = size * 0.18;
                        ctx.beginPath();
                        ctx.arc(0, 0, size * 0.9, Math.PI * 1.1, Math.PI * 1.9);
                        ctx.stroke();
                        ctx.fillStyle = "#cc6622";
                        ctx.beginPath();
                        ctx.arc(-size * 0.9, 0, size * 0.32, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(size * 0.9, 0, size * 0.32, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#8a4418";
                        ctx.beginPath();
                        ctx.arc(-size * 0.9, 0, size * 0.18, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(size * 0.9, 0, size * 0.18, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case "goggles": {
                        ctx.fillStyle = "#22bb22";
                        ctx.beginPath();
                        ctx.ellipse((lx + rx) / 2, (ly + ry) / 2, size * 0.95, size * 0.38, -eyeAngle, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "rgba(180,255,180,0.5)";
                        ctx.beginPath();
                        ctx.ellipse(
                            (lx + rx) / 2 - size * 0.25,
                            (ly + ry) / 2 - size * 0.1,
                            size * 0.35,
                            size * 0.15,
                            -eyeAngle,
                            0,
                            Math.PI * 2
                        );
                        ctx.fill();
                        break;
                    }
                    case "horns": {
                        ctx.fillStyle = "#aa2222";
                        ctx.beginPath();
                        ctx.moveTo(-size * 0.65, -size * 0.35);
                        ctx.quadraticCurveTo(-size * 1.1, -size * 0.9, -size * 0.85, -size * 1.4);
                        ctx.quadraticCurveTo(-size * 0.6, -size * 0.9, -size * 0.35, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(size * 0.65, -size * 0.35);
                        ctx.quadraticCurveTo(size * 1.1, -size * 0.9, size * 0.85, -size * 1.4);
                        ctx.quadraticCurveTo(size * 0.6, -size * 0.9, size * 0.35, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    }
                    case "angelwings": {
                        ctx.fillStyle = "#ffffff";
                        ctx.strokeStyle = "#cccccc";
                        ctx.lineWidth = 2;
                        for (const side of [-1, 1]) {
                            ctx.beginPath();
                            ctx.moveTo(side * size * 0.4, -size * 0.15);
                            ctx.quadraticCurveTo(side * size * 1.6, -size * 1.1, side * size * 1.5, size * 0.15);
                            ctx.quadraticCurveTo(side * size * 1.2, -size * 0.35, side * size * 0.4, size * 0.15);
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                        }
                        break;
                    }
                    case "bowtie": {
                        ctx.fillStyle = "#ff44aa";
                        ctx.beginPath();
                        ctx.moveTo(-size * 0.15, -size * 0.9);
                        ctx.lineTo(-size * 0.7, -size * 1.25);
                        ctx.lineTo(-size * 0.7, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(size * 0.15, -size * 0.9);
                        ctx.lineTo(size * 0.7, -size * 1.25);
                        ctx.lineTo(size * 0.7, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = "#cc2288";
                        ctx.beginPath();
                        ctx.arc(0, -size * 0.9, size * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case "mustache": {
                        ctx.fillStyle = "#4a2a1a";
                        ctx.beginPath();
                        ctx.moveTo(-size * 0.5, size * 0.3);
                        ctx.quadraticCurveTo(-size * 0.65, -size * 0.1, -size * 0.1, 0);
                        ctx.quadraticCurveTo(0, size * 0.15, size * 0.1, 0);
                        ctx.quadraticCurveTo(size * 0.65, -size * 0.1, size * 0.5, size * 0.3);
                        ctx.quadraticCurveTo(size * 0.2, size * 0.4, 0, size * 0.15);
                        ctx.quadraticCurveTo(-size * 0.2, size * 0.4, -size * 0.5, size * 0.3);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    }
                }
                ctx.restore();
            }

            function getGlowSprite(hue) {
                hue = Math.floor(hue / 10) * 10;
                let sprite = glowCache.get(hue);
                if (sprite) return sprite;
                const S = 64;
                const c = document.createElement("canvas");
                c.width = S;
                c.height = S;
                const cx = c.getContext("2d");
                const grad = cx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
                grad.addColorStop(0, `hsl(${hue}, 100%, 50%)`);
                grad.addColorStop(0.4, `hsl(${hue}, 100%, 50%)`);
                grad.addColorStop(1, "rgba(0,0,0,0)");
                cx.fillStyle = grad;
                cx.fillRect(0, 0, S, S);
                glowCache.set(hue, c);
                return c;
            }

            let glowSprite = null;
            let lastGlowHue = -1;
            let lastGlowBodySize = -1;

            function getBoostGlowSprite(hue, bodySize) {
                const bucketHue = Math.floor(hue / 10) * 10;
                if (glowSprite && lastGlowHue === bucketHue && lastGlowBodySize === bodySize) return glowSprite;
                const S = 256;
                const c = document.createElement("canvas");
                c.width = S;
                c.height = S;
                const cx = c.getContext("2d");
                const R = S / 2;
                const glowRadius = bodySize + 60;
                const bodyRatio = bodySize / glowRadius;
                const f = 1 - bodyRatio;
                const grad = cx.createRadialGradient(R, R, 0, R, R, R);
                grad.addColorStop(0, "rgba(0,0,0,0)");
                grad.addColorStop(bodyRatio * 0.98, "rgba(0,0,0,0)");
                grad.addColorStop(bodyRatio * 0.995, `hsla(${bucketHue}, 100%, 78%, 1.00)`);
                grad.addColorStop(bodyRatio, `hsla(${bucketHue}, 100%, 78%, 1.00)`);
                grad.addColorStop(bodyRatio * 1.025, `hsla(${bucketHue}, 100%, 78%, 1.00)`);
                grad.addColorStop(bodyRatio + f * 0.06, `hsla(${bucketHue}, 100%, 62%, 0.35)`);
                grad.addColorStop(bodyRatio + f * 0.14, `hsla(${bucketHue}, 100%, 55%, 0.14)`);
                grad.addColorStop(bodyRatio + f * 0.28, `hsla(${bucketHue}, 98%, 50%, 0.05)`);
                grad.addColorStop(bodyRatio + f * 0.48, `hsla(${bucketHue}, 95%, 46%, 0.02)`);
                grad.addColorStop(bodyRatio + f * 0.72, `hsla(${bucketHue}, 92%, 44%, 0.008)`);
                grad.addColorStop(bodyRatio + f * 0.9, `hsla(${bucketHue}, 88%, 42%, 0.002)`);
                grad.addColorStop(1.0, "rgba(0,0,0,0)");
                cx.fillStyle = grad;
                cx.fillRect(0, 0, S, S);
                glowSprite = c;
                lastGlowHue = bucketHue;
                lastGlowBodySize = bodySize;
                return c;
            }

            function calculateSnakeMass(snake) {
                let m = 0;
                for (let i = 0; i < snake.segments.length; i++) m += Math.PI * Math.pow(snake.segments[i].size, 2);
                return m;
            }

            function updateSegments(snake, spacing) {
                if (snake.segments.length === 0)
                    snake.segments.push({ x: snake.x, y: snake.y, size: snake.targetSize });
                if (!isFinite(snake.length) || snake.length < 1) snake.length = 1;
                snake.segments[0].x = snake.x;
                snake.segments[0].y = snake.y;
                while (snake.segments.length < snake.length) {
                    const tail = snake.segments[snake.segments.length - 1];
                    snake.segments.push({ x: tail.x, y: tail.y, size: tail.size });
                }
                while (snake.segments.length > snake.length) snake.segments.pop();
                for (let i = 1; i < snake.segments.length; i++) {
                    const prev = snake.segments[i - 1],
                        seg = snake.segments[i];
                    const dx = prev.x - seg.x,
                        dy = prev.y - seg.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > spacing) {
                        const t = (dist - spacing) / dist;
                        seg.x += dx * t;
                        seg.y += dy * t;
                    }
                }
                for (let i = 0; i < snake.segments.length; i++) {
                    const seg = snake.segments[i];
                    seg.size += (snake.targetSize - seg.size) * 0.1;
                }
            }

            function getSpinePoints(snake) {
                const pts = [];
                if (!snake.segments.length) return pts;
                const SPINE_HITBOX_RADIUS = 6;
                pts.push({ x: snake.x, y: snake.y, radius: SPINE_HITBOX_RADIUS });
                const SPINE_STEP = 6;
                for (let i = 1; i < snake.segments.length; i++) {
                    const a = snake.segments[i - 1],
                        b = snake.segments[i];
                    const dx = b.x - a.x,
                        dy = b.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 0.01) continue;
                    const steps = Math.max(1, Math.floor(dist / SPINE_STEP));
                    for (let s = 1; s <= steps; s++) {
                        const t = s / steps;
                        pts.push({ x: a.x + dx * t, y: a.y + dy * t, radius: SPINE_HITBOX_RADIUS });
                    }
                }
                return pts;
            }

            // ========== GAME LOOP ==========
            function gameLoop() {
                update();
                render();

            function update() {
                if (!gameStarted) return;
                gameTime++;

                                // ---- SEND INPUT TO SERVER ~30 Hz ----
                if (mpSocket && mpSocket.readyState === 1 && playerSnake.isAlive) {
                    const sendNow = performance.now();
                    if (sendNow - mpLastSendTime >= MP_SEND_INTERVAL_MS) {
                        mpLastSendTime = sendNow;
                        mpSocket.send(
                            JSON.stringify({
                                type: "input",
                                angle: mouseDirection,
                                boost: isBoosting && playerSnake.length > 10,
                            })
                        );
                    }
                }

                                // ---- READ MOUSE INPUT (delayed, sent to server) ----
                if (playerSnake.isAlive) {
                    const now = performance.now();
                    let laggedInput = null;
                    while (mouseBuffer.length && now - mouseBuffer[0].time >= INPUT_LAG_MS)
                        laggedInput = mouseBuffer.shift();
                    if (laggedInput) {
                        mouseDirection = laggedInput.direction;
                        mouseDistance = laggedInput.distance;
                    }

                    // Advance band scroll for visual effects
                    bandScroll += 3 * 0.15;
                }

                // ---- PLAYER PLAYBACK (interpolated from server state) ----
                const RENDER_DELAY_MS = 40;
                if (playerSnapshots.length > 0) {
                    const playbackTime = performance.now() - RENDER_DELAY_MS;
                    const arr = playerSnapshots;
                    let older = arr[0];
                    let newer = arr[0];
                    const lastIdx = arr.length - 1;

                    if (playbackTime <= arr[0].time) {
                        older = newer = arr[0];
                    } else if (playbackTime >= arr[lastIdx].time) {
                        if (arr.length > 1) {
                            older = arr[lastIdx - 1];
                            newer = arr[lastIdx];
                        } else {
                            older = newer = arr[lastIdx];
                        }
                    } else {
                        for (let i = 0; i < lastIdx; i++) {
                            if (arr[i].time <= playbackTime && arr[i + 1].time >= playbackTime) {
                                older = arr[i];
                                newer = arr[i + 1];
                                break;
                            }
                        }
                    }

                    const span = Math.max(1, newer.time - older.time);
                    let t = (playbackTime - older.time) / span;
                    t = Math.max(0, Math.min(1.5, t));

                    playerSnake.x = older.x + (newer.x - older.x) * t;
                    playerSnake.y = older.y + (newer.y - older.y) * t;

                    let dDiff = ((newer.dir - older.dir + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
                    playerSnake.direction = older.dir + dDiff * t;

                    playerSnake.targetSize = older.targetSize + (newer.targetSize - older.targetSize) * t;
                    playerSnake.length = newer.length;
                    playerSnake.mass = newer.mass || 0;
                    playerSnake.boostRamp = newer.boost ? 1 : 0;

                    if (!playerSnake.segments || playerSnake.segments.length === 0) {
                        playerSnake.segments = [];
                        for (let i = 0; i < playerSnake.length; i++) {
                            playerSnake.segments.push({
                                x: playerSnake.x,
                                y: playerSnake.y,
                                size: playerSnake.targetSize,
                            });
                        }
                    }
                    updateSegments(playerSnake, SEGMENT_SPACING);

                    mass = Math.floor(playerSnake.mass);
                    score = Math.floor(playerSnake.mass / 10);
                    document.getElementById("score").textContent = score;
                    document.getElementById("mass").textContent = `${Math.floor(playerSnake.length)} length`;

                    // Local laser backup (in case server connection is lost)
                    const rdx = playerSnake.x - ARENA_CENTER_X;
                    const rdy = playerSnake.y - ARENA_CENTER_Y;
                    if (rdx * rdx + rdy * rdy > ARENA_RADIUS * ARENA_RADIUS) {
                        killPlayerLocally();
                    }
                }

                // ---- REMOTE SNAKE PLAYBACK ----

                // ---- REMOTE SNAKE PLAYBACK ----
                const playbackTime = performance.now() - RENDER_DELAY_MS;
                for (const remote of remoteSnakes.values()) {
                    const snaps = remote.snapshots;
                    if (!snaps || snaps.length === 0) continue;
                    let older = null,
                        newer = null;
                    const lastIdx = snaps.length - 1;
                    if (playbackTime <= snaps[0].time) {
                        older = snaps[0];
                        newer = snaps.length > 1 ? snaps[1] : snaps[0];
                    } else if (playbackTime >= snaps[lastIdx].time) {
                        if (snaps.length > 1) {
                            older = snaps[lastIdx - 1];
                            newer = snaps[lastIdx];
                        } else {
                            older = newer = snaps[lastIdx];
                        }
                    } else {
                        older = snaps[0];
                        newer = snaps[lastIdx];
                        for (let i = 0; i < lastIdx; i++) {
                            if (snaps[i].time <= playbackTime && snaps[i + 1].time >= playbackTime) {
                                older = snaps[i];
                                newer = snaps[i + 1];
                                break;
                            }
                        }
                    }
                    const span = Math.max(1, newer.time - older.time);
                    let t = (playbackTime - older.time) / span;
                    t = Math.max(0, Math.min(1.5, t));
                    remote.x = older.x + (newer.x - older.x) * t;
                    remote.y = older.y + (newer.y - older.y) * t;
                    let dDiff = ((newer.dir - older.dir + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
                    remote.direction = older.dir + dDiff * t;
                    remote.targetSize = older.targetSize + (newer.targetSize - older.targetSize) * t;
                    remote.length = newer.length;
                    remote.mass = newer.mass || 0;

                    if (!remote.segments || remote.segments.length === 0) {
                        remote.segments = [];
                        for (let i = 0; i < remote.length; i++)
                            remote.segments.push({ x: remote.x, y: remote.y, size: remote.targetSize });
                    }
                    remote.segments[0].x = remote.x;
                    remote.segments[0].y = remote.y;
                    while (remote.segments.length < remote.length) {
                        const tail = remote.segments[remote.segments.length - 1];
                        remote.segments.push({ x: tail.x, y: tail.y, size: tail.size });
                    }
                    while (remote.segments.length > remote.length) remote.segments.pop();
                    for (let i = 1; i < remote.segments.length; i++) {
                        const prev = remote.segments[i - 1],
                            seg = remote.segments[i];
                        const dx = prev.x - seg.x,
                            dy = prev.y - seg.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > SEGMENT_SPACING) {
                            const tt = (dist - SEGMENT_SPACING) / dist;
                            seg.x += dx * tt;
                            seg.y += dy * tt;
                        }
                    }
                    for (let i = 0; i < remote.segments.length; i++) {
                        const seg = remote.segments[i];
                        seg.size += (remote.targetSize - seg.size) * 0.1;
                    }
                }

                // ---- PARTICLES ----
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life--;
                    p.size *= 0.95;
                    if (p.life <= 0 || p.size < 0.1) particles.splice(i, 1);
                }

                // ---- CAMERA ----
                if (playerSnake.isAlive) {
                    const viewW = canvas.width / zoom,
                        viewH = canvas.height / zoom;
                    const targetCamX = playerSnake.x - viewW / 2;
                    const targetCamY = playerSnake.y - viewH / 2;
                    camera.x += (targetCamX - camera.x) * 0.12;
                    camera.y += (targetCamY - camera.y) * 0.12;
                    camera.x = Math.max(0, Math.min(WORLD_SIZE.width - viewW, camera.x));
                    camera.y = Math.max(0, Math.min(WORLD_SIZE.height - viewH, camera.y));
                }

                if (gameTime % 10 === 0) updateLeaderboard();
            }

            // ========== RENDER ==========
                        function render() {
                ctx.fillStyle = "#0a0a15";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (gameStarted && !gameReady) {
                    ctx.fillStyle = "#ffffff";
                    ctx.font = "bold 28px Arial, sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("Loading...", canvas.width / 2, canvas.height / 2);
                    return;
                }

                ctx.save();
                ctx.scale(zoom, zoom);
                ctx.translate(-camera.x, -camera.y);

                if (!hexTileCanvas) hexTileCanvas = makeHexTile(75, 60, 14, "#232334", "rgba(0,0,0,0.9)");
                const TILE_W = hexTileCanvas.width,
                    TILE_H = hexTileCanvas.height;
                const viewW = canvas.width / zoom,
                    viewH = canvas.height / zoom;
                const startCol = Math.floor(camera.x / TILE_W) - 1;
                const endCol = Math.ceil((camera.x + viewW) / TILE_W) + 1;
                const startRow = Math.floor(camera.y / TILE_H) - 1;
                const endRow = Math.ceil((camera.y + viewH) / TILE_H) + 1;
                for (let col = startCol; col <= endCol; col++) {
                    for (let row = startRow; row <= endRow; row++)
                        ctx.drawImage(hexTileCanvas, col * TILE_W, row * TILE_H);
                }

                // Arena ring
                {
                    const pulse = 0.85 + Math.sin(gameTime * 0.06) * 0.15;
                    ctx.strokeStyle = `rgba(255, 40, 40, ${0.06 * pulse})`;
                    ctx.lineWidth = 90;
                    ctx.beginPath();
                    ctx.arc(ARENA_CENTER_X, ARENA_CENTER_Y, ARENA_RADIUS, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = `rgba(255, 60, 60, ${0.18 * pulse})`;
                    ctx.lineWidth = 34;
                    ctx.beginPath();
                    ctx.arc(ARENA_CENTER_X, ARENA_CENTER_Y, ARENA_RADIUS, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.strokeStyle = `rgba(255, 90, 90, ${0.55 * pulse})`;
                    ctx.lineWidth = 10;
                    ctx.beginPath();
                    ctx.arc(ARENA_CENTER_X, ARENA_CENTER_Y, ARENA_RADIUS, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowColor = "#ff2020";
                    ctx.shadowBlur = 25;
                    ctx.strokeStyle = `rgba(255, 220, 220, ${0.9 * pulse})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(ARENA_CENTER_X, ARENA_CENTER_Y, ARENA_RADIUS, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                    ctx.shadowColor = "transparent";
                }

                // Food
                const tWig = gameTime * 0.08;
                serverFood.forEach((food) => {
                    if (food.x < camera.x - 50 || food.x > camera.x + viewW + 50) return;
                    if (food.y < camera.y - 50 || food.y > camera.y + viewH + 50) return;
                    const ws = 1;
                    const seed = (food.id % 100) * 0.1;
                    const wigX = Math.sin(tWig * ws + seed) * 1.6;
                    const wigY = Math.cos(tWig * ws * 0.9 + seed * 1.3) * 1.6;
                    const dx = food.x + wigX,
                        dy = food.y + wigY;
                    const pulse = 1 + Math.sin(tWig * ws * 1.4 + seed) * 0.12;
                    const glowD = food.size * 6 * pulse;
                    const glow = getGlowSprite(food.hue);
                    ctx.drawImage(glow, dx - glowD / 2, dy - glowD / 2, glowD, glowD);
                    ctx.fillStyle = `hsl(${food.hue}, 100%, 50%)`;
                    ctx.beginPath();
                    ctx.arc(dx, dy, food.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Particles
                particles.forEach((p) => {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life / 30;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.globalAlpha = 1;

                // Remote snakes (players + AI)
                for (const remote of remoteSnakes.values()) {
                    if (!remote.isAlive) continue;
                    if (!remote.segments || remote.segments.length === 0) continue;
                    drawSnake(remote);
                    // Name tag distance check for AI (same as before) — for players always show
                    if (!remote.isAI) {
                        drawNameTag(remote);
                    } else {
                        const pdx = remote.x - playerSnake.x,
                            pdy = remote.y - playerSnake.y;
                        if (pdx * pdx + pdy * pdy < 800 * 800) drawNameTag(remote);
                    }
                }

                // Player snake
                if (playerSnake.isAlive) {
                    drawSnake(playerSnake);
                    drawNameTag(playerSnake);
                }

                // Debug spine
                if (debugSpine) {
                    const ps = getSpinePoints(playerSnake);
                    if (ps.length > 1) {
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
                        ctx.lineWidth = 2;
                        ctx.lineCap = "round";
                        ctx.lineJoin = "round";
                        ctx.beginPath();
                        ctx.moveTo(ps[0].x, ps[0].y);
                        for (let i = 1; i < ps.length; i++) ctx.lineTo(ps[i].x, ps[i].y);
                        ctx.stroke();
                    }
                    for (const s of remoteSnakes.values()) {
                        if (!s.isAlive) continue;
                        const sp = getSpinePoints(s);
                        if (sp.length < 2) continue;
                        ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(sp[0].x, sp[0].y);
                        for (let i = 1; i < sp.length; i++) ctx.lineTo(sp[i].x, sp[i].y);
                        ctx.stroke();
                    }
                }

                ctx.restore();

                if (gameStarted && playerSnake.isAlive) drawMinimap();
            }

            function drawSnake(snake) {
                if (!snake.segments.length) return;
                const head = snake.segments[0];
                const hue = snake.color.split("(")[1].split(",")[0];

                const snakeBoostRamp = snake.boostRamp || 0;
                if (snakeBoostRamp > 0.02) {
                    const skinHue =
                        snake.id === "player" ? savedHue : parseInt(snake.color.split("(")[1].split(",")[0]);
                    const sprite = getBoostGlowSprite(skinHue, snake.targetSize);
                    const viewW = canvas.width / zoom,
                        viewH = canvas.height / zoom;
                    const bandLen = 2 + Math.floor(snake.targetSize / bandlength);
                    for (let i = snake.segments.length - 1; i >= 1; i--) {
                        const seg = snake.segments[i];
                        if (seg.x < camera.x - 140 || seg.x > camera.x + viewW + 140) continue;
                        if (seg.y < camera.y - 140 || seg.y > camera.y + viewH + 140) continue;
                        const cycle = 2 * bandLen;
                        const phase = (((i - bandScroll) % cycle) + cycle) % cycle;
                        const bandIndex = phase < bandLen ? 0 : 1;
                        const bandMultiplier = bandIndex === 0 ? 1.0 : 0.04;
                        const segGlowSize = (seg.size + 60) * 2;
                        ctx.globalAlpha = snakeBoostRamp * bandMultiplier;
                        ctx.drawImage(
                            sprite,
                            seg.x - segGlowSize / 2,
                            seg.y - segGlowSize / 2,
                            segGlowSize,
                            segGlowSize
                        );
                    }
                    ctx.globalAlpha = 1;
                }

                for (let i = snake.segments.length - 1; i >= 1; i--) {
                    const seg = snake.segments[i];
                    const bandLen = 2 + Math.floor(snake.targetSize / 8);
                    const bandIndex = Math.floor(i / bandLen) % 2;
                    const baseColor = bandIndex === 0 ? `hsl(${hue}, 85%, 48%)` : `hsl(${hue}, 22%, 32%)`;
                    ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                    ctx.beginPath();
                    ctx.arc(seg.x + 2, seg.y + 3, seg.size + 1, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = baseColor;
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, seg.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "rgba(0, 0, 0, 0.75)";
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(seg.x, seg.y, seg.size, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Head shadow
                ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                ctx.beginPath();
                ctx.arc(head.x + 2, head.y + 3, head.size + 1, 0, Math.PI * 2);
                ctx.fill();

                const headGradient = ctx.createRadialGradient(
                    head.x - head.size * 0.3,
                    head.y - head.size * 0.3,
                    0,
                    head.x,
                    head.y,
                    head.size
                );
                headGradient.addColorStop(0, `hsl(${hue}, 90%, 55%)`);
                headGradient.addColorStop(1, `hsl(${hue}, 70%, 32%)`);
                ctx.fillStyle = headGradient;
                ctx.beginPath();
                ctx.arc(head.x, head.y, head.size, 0, Math.PI * 2);
                ctx.fill();

                // Cosmetic
                if (snake.id === "player" && savedCosmetic && savedCosmetic !== "none") {
                    const offsetDist = (Y_OFFSETS[savedCosmetic] || 0) * head.size;
                    let accum = 0,
                        px = head.x,
                        py = head.y,
                        dirAngle = snake.direction;
                    if (offsetDist > 0.1) {
                        for (let i = 1; i < snake.segments.length; i++) {
                            const a = snake.segments[i - 1],
                                b = snake.segments[i];
                            const dx = b.x - a.x,
                                dy = b.y - a.y;
                            const segLen = Math.sqrt(dx * dx + dy * dy);
                            if (segLen < 0.01) continue;
                            if (accum + segLen >= offsetDist) {
                                const t = (offsetDist - accum) / segLen;
                                px = a.x + dx * t;
                                py = a.y + dy * t;
                                dirAngle = Math.atan2(dy, dx);
                                break;
                            }
                            accum += segLen;
                            px = b.x;
                            py = b.y;
                            dirAngle = Math.atan2(dy, dx);
                        }
                    }
                    drawCosmetic(ctx, savedCosmetic, px, py, head.size, dirAngle, true);
                }

                // Eyes
                if (snake.id === "player" || snake.size > 15) {
                    let targetX, targetY;
                    if (snake.id === "player") {
                        targetX = camera.x + viewW() / 2 + Math.cos(mouseDirection) * mouseDistance;
                        targetY = camera.y + viewH() / 2 + Math.sin(mouseDirection) * mouseDistance;
                    } else {
                        let lookDir = snake.direction;
                        if (snake.segments && snake.segments.length >= 3) {
                            const s2 = snake.segments[2];
                            const bendDir = Math.atan2(head.y - s2.y, head.x - s2.x);
                            let diff = ((bendDir - snake.direction + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
                            lookDir = snake.direction + diff * 0.5;
                        }
                        targetX = head.x + Math.cos(lookDir) * 200;
                        targetY = head.y + Math.sin(lookDir) * 200;
                    }
                    const eyeSize = head.size * 0.28;
                    const eyeOffset = head.size * 0.55;
                    const faceAngle = snake.direction;
                    const leftAngle = faceAngle + Math.PI / 3;
                    const rightAngle = faceAngle - Math.PI / 3;
                    const lx = head.x + Math.cos(leftAngle) * eyeOffset;
                    const ly = head.y + Math.sin(leftAngle) * eyeOffset;
                    const rx = head.x + Math.cos(rightAngle) * eyeOffset;
                    const ry = head.y + Math.sin(rightAngle) * eyeOffset;
                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(lx, ly, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(rx, ry, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "black";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(lx, ly, eyeSize, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(rx, ry, eyeSize, 0, Math.PI * 2);
                    ctx.stroke();
                    const pupilSize = eyeSize * 0.55;
                    const pupilDist = eyeSize * 0.35;
                    const lpAngle = Math.atan2(targetY - ly, targetX - lx);
                    const rpAngle = Math.atan2(targetY - ry, targetX - rx);
                    ctx.fillStyle = "black";
                    ctx.beginPath();
                    ctx.arc(
                        lx + Math.cos(lpAngle) * pupilDist,
                        ly + Math.sin(lpAngle) * pupilDist,
                        pupilSize,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(
                        rx + Math.cos(rpAngle) * pupilDist,
                        ry + Math.sin(rpAngle) * pupilDist,
                        pupilSize,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            }

            function drawNameTag(snake) {
                const head = snake.segments[0];
                if (!head) return;
                const text = snake.name || "Player";
                const fontSize = Math.max(14, head.size * 0.9);
                ctx.font = `600 ${fontSize}px Arial, sans-serif`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                const x = head.x,
                    y = head.y - head.size - fontSize * 0.6;
                ctx.lineWidth = Math.max(3, fontSize * 0.18);
                ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
                ctx.lineJoin = "round";
                ctx.strokeText(text, x, y);
                ctx.fillStyle = "#ffffff";
                ctx.fillText(text, x, y);
            }

            function viewW() {
                return canvas.width / zoom;
            }
            function viewH() {
                return canvas.height / zoom;
            }

            window.addEventListener("resize", () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });

            function drawMinimap() {
                const size = 140,
                    pad = 24;
                const cx = canvas.width - pad - size / 2;
                const cy = canvas.height - pad - size / 2;
                const r = size / 2;
                const worldToMapX = (wx) => cx - r + (wx / WORLD_SIZE.width) * size;
                const worldToMapY = (wy) => cy - r + (wy / WORLD_SIZE.height) * size;
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fill();
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.clip();
                for (let i = 0; i < 4; i++) {
                    const start = (i * Math.PI) / 2 - Math.PI / 2;
                    const end = start + Math.PI / 2;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, r, start, end);
                    ctx.closePath();
                    ctx.fillStyle = i % 2 === 0 ? "rgba(255, 255, 255, 0.10)" : "rgba(255, 255, 255, 0.02)";
                    ctx.fill();
                }
                ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
                ctx.lineWidth = 1;
                for (const s of remoteSnakes.values()) {
                    if (!s.isAlive || s.segments.length < 2) continue;
                    const step = Math.max(1, Math.floor(s.segments.length / 8));
                    ctx.beginPath();
                    for (let i = 0; i < s.segments.length; i += step) {
                        const mx = worldToMapX(s.segments[i].x),
                            my = worldToMapY(s.segments[i].y);
                        if (i === 0) ctx.moveTo(mx, my);
                        else ctx.lineTo(mx, my);
                    }
                    const tail = s.segments[s.segments.length - 1];
                    ctx.lineTo(worldToMapX(tail.x), worldToMapY(tail.y));
                    ctx.stroke();
                }
                const px = worldToMapX(playerSnake.x),
                    py = worldToMapY(playerSnake.y);
                ctx.shadowColor = "rgba(255, 255, 255, 0.9)";
                ctx.shadowBlur = 6;
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(px, py, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
                ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
                ctx.lineWidth = 1;
                for (let i = 0; i < 4; i++) {
                    const a = (i * Math.PI) / 2 - Math.PI / 2;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
                    ctx.stroke();
                }
                ctx.strokeStyle = "rgba(255, 255, 255, 0.55)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy, r - 1, 0, Math.PI * 2);
                ctx.stroke();
                ctx.restore();
            }

            // ========== SKIN CUSTOMIZATION ==========
            const SKIN_HUES = [280, 20, 140, 200, 340, 60, 0];
            let skinIndex = 0;
            let savedHue = 280;
            let savedCosmetic = "none";

            let skinAnimId = null;
            let skinBgOffset = 0;

            function initSkinSystem() {
                const changeBtn = document.getElementById("change-skin-btn");
                const skinScreen = document.getElementById("skin-screen");
                const startScreen = document.getElementById("start-screen");
                const prevBtn = document.getElementById("skin-prev");
                const nextBtn = document.getElementById("skin-next");
                const saveBtn = document.getElementById("skin-save");
                const sCanvas = document.getElementById("skin-canvas");
                const sctx = sCanvas.getContext("2d");
                sCanvas.width = window.innerWidth;
                sCanvas.height = window.innerHeight;
                let W = sCanvas.width,
                    H = sCanvas.height;
                window.addEventListener("resize", () => {
                    sCanvas.width = window.innerWidth;
                    sCanvas.height = window.innerHeight;
                    W = sCanvas.width;
                    H = sCanvas.height;
                });
                const previewTile = makeHexTile(60, 48, 12, "#1a3a26", "rgba(0,0,0,0.9)");
                const previewPattern = sctx.createPattern(previewTile, "repeat");

                function drawSkinFrame() {
                    skinBgOffset -= 3;
                    if (skinBgOffset < -previewTile.width) skinBgOffset += previewTile.width;
                    sctx.save();
                    sctx.fillStyle = "#0a1a10";
                    sctx.fillRect(0, 0, W, H);
                    sctx.translate(skinBgOffset, 0);
                    sctx.fillStyle = previewPattern;
                    sctx.fillRect(-skinBgOffset, 0, W + previewTile.width, H);
                    sctx.restore();

                    const hue = SKIN_HUES[skinIndex];
                    const segCount = 140,
                        segSpacing = 5,
                        headSize = 22;
                    const headX = W / 1.5,
                        baseY = H / 2;
                    const t = performance.now() / 400;
                    const spine = [];
                    for (let i = 0; i < segCount; i++) {
                        const segT = t - i * 0.038;
                        const taper = 1 - (i / segCount) * 0.3;
                        spine.push({
                            x: headX - i * segSpacing,
                            y: baseY + Math.sin(segT) * 18,
                            size: headSize * taper,
                        });
                    }
                    for (let i = spine.length - 1; i >= 1; i--) {
                        const seg = spine[i];
                        const bandIndex = Math.floor(i / 4) % 2;
                        const baseColor = bandIndex === 0 ? `hsl(${hue}, 85%, 48%)` : `hsl(${hue}, 22%, 32%)`;
                        sctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                        sctx.beginPath();
                        sctx.arc(seg.x + 2, seg.y + 3, seg.size + 1, 0, Math.PI * 2);
                        sctx.fill();
                        sctx.fillStyle = baseColor;
                        sctx.beginPath();
                        sctx.arc(seg.x, seg.y, seg.size, 0, Math.PI * 2);
                        sctx.fill();
                        sctx.strokeStyle = "rgba(0, 0, 0, 0.75)";
                        sctx.lineWidth = 3;
                        sctx.beginPath();
                        sctx.arc(seg.x, seg.y, seg.size, 0, Math.PI * 2);
                        sctx.stroke();
                    }
                    const head = spine[0];
                    sctx.fillStyle = "rgba(0, 0, 0, 0.5)";
                    sctx.beginPath();
                    sctx.arc(head.x + 2, head.y + 3, head.size + 1, 0, Math.PI * 2);
                    sctx.fill();
                    const hg = sctx.createRadialGradient(
                        head.x - head.size * 0.3,
                        head.y - head.size * 0.3,
                        0,
                        head.x,
                        head.y,
                        head.size
                    );
                    hg.addColorStop(0, `hsl(${hue}, 90%, 55%)`);
                    hg.addColorStop(1, `hsl(${hue}, 70%, 32%)`);
                    sctx.fillStyle = hg;
                    sctx.beginPath();
                    sctx.arc(head.x, head.y, head.size, 0, Math.PI * 2);
                    sctx.fill();
                    const eyeSize = head.size * 0.28,
                        eyeOffset = head.size * 0.55;
                    const lx = head.x + Math.cos(Math.PI / 3) * eyeOffset,
                        ly = head.y + Math.sin(Math.PI / 3) * eyeOffset;
                    const rx = head.x + Math.cos(-Math.PI / 3) * eyeOffset,
                        ry = head.y + Math.sin(-Math.PI / 3) * eyeOffset;
                    sctx.fillStyle = "white";
                    sctx.beginPath();
                    sctx.arc(lx, ly, eyeSize, 0, Math.PI * 2);
                    sctx.fill();
                    sctx.beginPath();
                    sctx.arc(rx, ry, eyeSize, 0, Math.PI * 2);
                    sctx.fill();
                    sctx.strokeStyle = "black";
                    sctx.lineWidth = 2;
                    sctx.beginPath();
                    sctx.arc(lx, ly, eyeSize, 0, Math.PI * 2);
                    sctx.stroke();
                    sctx.beginPath();
                    sctx.arc(rx, ry, eyeSize, 0, Math.PI * 2);
                    sctx.stroke();
                    const pupilSize = eyeSize * 0.55,
                        pupilDist = eyeSize * 0.35;
                    sctx.fillStyle = "black";
                    sctx.beginPath();
                    sctx.arc(lx + pupilDist, ly, pupilSize, 0, Math.PI * 2);
                    sctx.fill();
                    sctx.beginPath();
                    sctx.arc(rx + pupilDist, ry, pupilSize, 0, Math.PI * 2);
                    sctx.fill();
                    skinAnimId = requestAnimationFrame(drawSkinFrame);
                }

                function openSkin() {
                    startScreen.style.display = "none";
                    skinScreen.style.display = "flex";
                    skinBgOffset = 0;
                    if (skinAnimId) cancelAnimationFrame(skinAnimId);
                    drawSkinFrame();
                }
                function closeSkin() {
                    skinScreen.style.display = "none";
                    startScreen.style.display = "flex";
                    if (skinAnimId) {
                        cancelAnimationFrame(skinAnimId);
                        skinAnimId = null;
                    }
                }
                changeBtn.addEventListener("click", openSkin);
                prevBtn.addEventListener("click", () => {
                    skinIndex = (skinIndex - 1 + SKIN_HUES.length) % SKIN_HUES.length;
                });
                nextBtn.addEventListener("click", () => {
                    skinIndex = (skinIndex + 1) % SKIN_HUES.length;
                });
                saveBtn.addEventListener("click", () => {
                    savedHue = SKIN_HUES[skinIndex];
                    closeSkin();
                });
            }
            initSkinSystem();

            // ========== COSMETIC SCREEN ==========
            function initCosmeticSystem() {
                const changeBtn = document.getElementById("change-cosmetic-btn");
                const cosScreen = document.getElementById("cosmetic-screen");
                const saveBtn = document.getElementById("cosmetic-save");
                const sCanvas = document.getElementById("cosmetic-canvas");
                const sctx = sCanvas.getContext("2d");
                sCanvas.width = window.innerWidth;
                sCanvas.height = window.innerHeight;
                let W = sCanvas.width,
                    H = sCanvas.height;
                window.addEventListener("resize", () => {
                    sCanvas.width = window.innerWidth;
                    sCanvas.height = window.innerHeight;
                    W = sCanvas.width;
                    H = sCanvas.height;
                });
                const COLS = 6,
                    ROWS = 3;
                const cellW = Math.min((W * 0.75) / COLS, 110);
                const cellH = Math.min((H * 0.42) / ROWS, 110);
                const gridW = cellW * COLS,
                    gridH = cellH * ROWS;
                const gridX = (W - gridW) / 2;
                const gridY = (H - gridH) / 2 - H * 0.08;
                const cosTile = makeHexTile(60, 48, 12, "#1a3a26", "rgba(0,0,0,0.9)");
                const cosPattern = sctx.createPattern(cosTile, "repeat");
                let bgOffset = 0,
                    animId = null,
                    hoverIndex = -1;
                function cellRect(i) {
                    const col = i % COLS,
                        row = Math.floor(i / COLS);
                    return { x: gridX + col * cellW, y: gridY + row * cellH, w: cellW, h: cellH };
                }
                function pointInRect(px, py, r) {
                    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
                }
                function drawFrame() {
                    bgOffset -= 3;
                    if (bgOffset < -cosTile.width) bgOffset += cosTile.width;
                    sctx.save();
                    sctx.fillStyle = "#0a1a10";
                    sctx.fillRect(0, 0, W, H);
                    sctx.translate(bgOffset, 0);
                    sctx.fillStyle = cosPattern;
                    sctx.fillRect(-bgOffset, 0, W + cosTile.width, H);
                    sctx.restore();
                    sctx.fillStyle = "#ffffff";
                    sctx.font = "bold 36px Arial";
                    sctx.textAlign = "center";
                    sctx.textBaseline = "middle";
                    sctx.fillText("COSMETICS", W / 2, gridY - 50);
                    for (let i = 0; i < COLS * ROWS; i++) {
                        const r = cellRect(i);
                        const id = COSMETICS[i];
                        if (!id) continue;
                        const isSelected = id === savedCosmetic;
                        const isHover = i === hoverIndex;
                        const cx = r.x + r.w / 2,
                            cy = r.y + r.h / 2;
                        const previewSize = r.h * 0.28;
                        if (isSelected) {
                            sctx.beginPath();
                            sctx.arc(cx, cy, previewSize * 1.6, 0, Math.PI * 2);
                            sctx.strokeStyle = "#7ec86a";
                            sctx.lineWidth = 4;
                            sctx.stroke();
                            sctx.fillStyle = "rgba(126, 200, 106, 0.15)";
                            sctx.fill();
                        } else if (isHover) {
                            sctx.beginPath();
                            sctx.arc(cx, cy, previewSize * 1.6, 0, Math.PI * 2);
                            sctx.strokeStyle = "rgba(255,255,255,0.5)";
                            sctx.lineWidth = 2;
                            sctx.stroke();
                        }
                        if (id === "none") {
                            sctx.strokeStyle = "#cc2222";
                            sctx.lineWidth = 6;
                            sctx.beginPath();
                            sctx.arc(cx, cy, previewSize * 1.1, 0, Math.PI * 2);
                            sctx.stroke();
                            sctx.beginPath();
                            sctx.moveTo(cx - previewSize * 0.8, cy + previewSize * 0.8);
                            sctx.lineTo(cx + previewSize * 0.8, cy - previewSize * 0.8);
                            sctx.stroke();
                        } else {
                            drawCosmetic(sctx, id, cx, cy, previewSize, -Math.PI / 2, true);
                        }
                    }
                    animId = requestAnimationFrame(drawFrame);
                }
                sCanvas.addEventListener("mousemove", (e) => {
                    const rect = sCanvas.getBoundingClientRect();
                    const mx = e.clientX - rect.left,
                        my = e.clientY - rect.top;
                    hoverIndex = -1;
                    for (let i = 0; i < COLS * ROWS; i++)
                        if (pointInRect(mx, my, cellRect(i))) {
                            hoverIndex = i;
                            break;
                        }
                    sCanvas.style.cursor = hoverIndex >= 0 ? "pointer" : "default";
                });
                sCanvas.addEventListener("click", (e) => {
                    const rect = sCanvas.getBoundingClientRect();
                    const mx = e.clientX - rect.left,
                        my = e.clientY - rect.top;
                    for (let i = 0; i < COLS * ROWS; i++) {
                        if (pointInRect(mx, my, cellRect(i))) {
                            const id = COSMETICS[i];
                            if (id) savedCosmetic = id;
                            break;
                        }
                    }
                });
                function openCos() {
                    document.getElementById("skin-screen").style.display = "none";
                    cosScreen.style.display = "block";
                    bgOffset = 0;
                    if (animId) cancelAnimationFrame(animId);
                    drawFrame();
                }
                function closeCos() {
                    cosScreen.style.display = "none";
                    document.getElementById("skin-screen").style.display = "flex";
                    if (animId) {
                        cancelAnimationFrame(animId);
                        animId = null;
                    }
                }
                changeBtn.addEventListener("click", openCos);
                saveBtn.addEventListener("click", closeCos);
            }
            initCosmeticSystem();

            // ========== MULTIPLAYER (Shared-World) ==========
            let mpSocket = null;
            let mpId = null;
            let mpLastSendTime = 0;
            const MP_SEND_INTERVAL_MS = 33;

                        function initMultiplayer() {
                // Close and detach any previous socket so stale events
                // don't bleed into the new session.
                if (mpSocket) {
                    try { mpSocket.close(); } catch (e) {}
                    mpSocket = null;
                }

                let sock;
                try {
                    sock = new WebSocket("wss://2slither.duckdns.org/ws");
                    mpSocket = sock;
                } catch (err) {
                    console.warn("[MP] failed to init:", err);
                    return;
                }

                sock.addEventListener("open", () => {
                    if (mpSocket !== sock) return;
                    sock.send(JSON.stringify({
                        type: "join",
                        name: playerSnake.name,
                        hue: savedHue,
                    }));
                    console.log("[MP] connected");
                });

                sock.addEventListener("close", () => {
                    if (mpSocket !== sock) return;
                    console.log("[MP] closed");
                    // If we never got the spawn, try again
                    if (gameStarted && !gameReady) {
                        console.log("[MP] retrying in 1s");
                        setTimeout(() => {
                            if (mpSocket === sock && gameStarted && !gameReady) {
                                initMultiplayer();
                            }
                        }, 1000);
                    }
                });

                sock.addEventListener("error", () => {
                    if (mpSocket !== sock) return;
                    console.log("[MP] error");
                });

                sock.addEventListener("message", (e) => {
                    if (mpSocket !== sock) return;
                    let msg;
                    try { msg = JSON.parse(e.data); } catch (err) { return; }
                    if (msg.type === "welcome") {
                        mpId = msg.id;
                    } else if (msg.type === "init" || msg.type === "state") {
                        applyServerState(msg);
                    } else if (msg.type === "chat") {
                        addChatMessage(msg.name, msg.text, msg.id === mpId);
                    } else if (msg.type === "death") {
                        if (msg.id === mpId) {
                            if (playerSnake.isAlive) {
                                playerSnake.isAlive = false;
                                document.getElementById("final-score").textContent = score;
                                setTimeout(() => { startFadeToMenu(); }, 800);
                            }
                        } else {
                            remoteSnakes.delete(msg.id);
                        }
                    }
                });
            }

            function sendBoost(on) {
                if (mpSocket && mpSocket.readyState === 1) {
                    try {
                        mpSocket.send(JSON.stringify({ type: "boost", on: !!on }));
                    } catch (e) {}
                }
            }

                        function applyServerState(msg) {
                // Food — server sends this at 15 Hz, not every tick
                if (msg.food !== undefined) {
                    serverFood = msg.food;
                }

                const seen = new Set();
                for (const s of msg.snakes) {
                    seen.add(s.id);

                    if (s.id === mpId) {
                        // Push server position into our own buffer.
                        // The playback loop reads this at RENDER_DELAY_MS delay.
                        const now = performance.now();
                        const lastT = playerSnapshots.length
                            ? playerSnapshots[playerSnapshots.length - 1].time
                            : 0;
                        const pushT = Math.max(now, lastT + 1);
                        playerSnapshots.push({
                            time: pushT,
                            x: s.x,
                            y: s.y,
                            dir: s.dir,
                            targetSize: s.sz,
                            length: s.len,
                            mass: s.mass || 0,
                            boost: !!s.boost,
                        });
                        while (playerSnapshots.length > 30) playerSnapshots.shift();

                                                // First packet — seed segments so the snake has a body immediately
                        if (!playerSnake._hasSpawned) {
                            playerSnake.x = s.x;
                            playerSnake.y = s.y;
                            playerSnake.direction = s.dir;
                            playerSnake._hasSpawned = true;
                            camera.x = playerSnake.x - canvas.width / 2;
                            camera.y = playerSnake.y - canvas.height / 2;
                            playerSnake.segments = [];
                            for (let i = 0; i < s.len; i++) {
                                playerSnake.segments.push({ x: s.x, y: s.y, size: s.sz });
                            }
                            gameReady = true;
                        }
                        continue;
                    }

                                        let remote = remoteSnakes.get(s.id);
                    if (!remote) {
                        remote = {
                            id: s.id,
                            name: s.name,
                            color: `hsl(${s.hue}, 100%, 50%)`,
                            size: s.sz,
                            targetSize: s.sz,
                            length: s.len,
                            mass: s.mass || 0,
                            boostRamp: 0,
                            x: s.x,
                            y: s.y,
                            direction: s.dir,
                            isAlive: true,
                            isAI: !!s.isAI,
                            snapshots: [],
                            segments: [],
                            lastSeen: performance.now(),
                        };
                        remoteSnakes.set(s.id, remote);
                    }
                    remote.lastSeen = performance.now();
                    const now = performance.now();
                    const lastT = remote.snapshots.length ? remote.snapshots[remote.snapshots.length - 1].time : 0;
                    const pushT = Math.max(now, lastT + 1);
                    remote.snapshots.push({
                        time: pushT,
                        x: s.x,
                        y: s.y,
                        dir: s.dir,
                        targetSize: s.sz,
                        length: s.len,
                        mass: s.mass || 0,
                        boost: !!s.boost,
                    });
                    const targetBoost = s.boost ? 1 : 0;
                    remote.boostRamp += (targetBoost - remote.boostRamp) * 0.25;
                    while (remote.snapshots.length > 0 && now - remote.snapshots[0].time > 1500)
                        remote.snapshots.shift();
                }
                                // Remove snakes the server no longer sends
                for (const id of [...remoteSnakes.keys()]) if (!seen.has(id)) remoteSnakes.delete(id);

                // Safety net: cull anything not seen in a state packet
                // for 1500ms. Catches missed death messages.
                const nowMs = performance.now();
                for (const id of [...remoteSnakes.keys()]) {
                    const r = remoteSnakes.get(id);
                    if (r && nowMs - (r.lastSeen || 0) > 1500) {
                        remoteSnakes.delete(id);
                    }
                }
            }

            setupInputHandlers();
        </script>
    </body>
