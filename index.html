                <!-- Chat Messages Container (No bubbles) -->
                <div id="ai-chat-messages"></div>

                    <div class="ai-input-wrapper">

                        <!-- New Paste Preview Container -->

                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>

        <script>
            // ========== HEX TILE ==========
            let bandScroll = 0;
            let bandlength = 2;
            let hexTileCanvas = null;

            function makeHexTile(hexSpacing, hexSize, blur, hexColor, outlineColor) {
                const HEX_W = hexSpacing * 1.5;
                const HEX_H = hexSpacing * Math.sqrt(3);
                const TW = Math.round(HEX_W * 2);
                const TH = Math.round(HEX_H * 2);
                const c = document.createElement("canvas");
                c.width = TW;
                c.height = TH;
                const cx = c.getContext("2d");
                const drawHexAt = (hx, hy) => {
                    cx.beginPath();
                    for (let v = 0; v < 6; v++) {
                        const a = (v * Math.PI) / 3;
                        const px = hx + hexSize * Math.cos(a);
                        const py = hy + hexSize * Math.sin(a);
                        if (v === 0) cx.moveTo(px, py);
                        else cx.lineTo(px, py);
                    }
                    cx.closePath();
                };
                for (let di = -1; di <= 1; di++) {
                    for (let dj = -1; dj <= 1; dj++) {
                        const offX = di * TW,
                            offY = dj * TH;
                        cx.shadowColor = "rgba(0, 0, 0, 0.95)";
                        cx.shadowBlur = blur;
                        cx.shadowOffsetX = 0;
                        cx.shadowOffsetY = 0;
                        cx.fillStyle = hexColor;
                        for (let col = 0; col <= 2; col++) {
                            const offset = col & 1 ? HEX_H / 2 : 0;
                            for (let row = 0; row <= 2; row++) {
                                drawHexAt(offX + col * HEX_W, offY + row * HEX_H + offset);
                                cx.fill();
                            }
                        }
                        cx.shadowColor = "transparent";
                        cx.shadowBlur = 0;
                        cx.strokeStyle = outlineColor;
                        cx.lineWidth = 2;
                        for (let col = 0; col <= 2; col++) {
                            const offset = col & 1 ? HEX_H / 2 : 0;
                            for (let row = 0; row <= 2; row++) {
                                drawHexAt(offX + col * HEX_W, offY + row * HEX_H + offset);
                                cx.stroke();
                            }
                        }
                    }
                }
                return c;
            }

            // ========== COSMETICS ==========
            const COSMETICS = [
                "none",
                "crown",
                "tophat",
                "bunny",
                "cat",
                "sunglasses",
                "3dglasses",
                "heartglasses",
                "blonde",
                "afro",
                "headphones",
                "goggles",
                "horns",
                "angelwings",
                "bowtie",
                "mustache",
            ];

            const Y_OFFSETS = {
                crown: 1.6,
                tophat: 1.6,
                bunny: 1.6,
                cat: 1.6,
                sunglasses: 0.15,
                "3dglasses": 0.15,
                heartglasses: 0.15,
                blonde: 1.3,
                afro: 1.3,
                headphones: 0.35,
                goggles: 0.15,
                horns: 1.3,
                angelwings: 0.9,
                bowtie: 1.2,
                mustache: 0.6,
            };

            function drawCosmetic(ctx, id, x, y, size, angle, noOffset) {
                if (!id || id === "none") return;
                let ox = 0,
                    oy = 0;
                if (!noOffset) {
                    const yOff = (Y_OFFSETS[id] || 0) * size;
                    const backDir = angle + Math.PI;
                    ox = Math.cos(backDir) * yOff * size;
                    oy = Math.sin(backDir) * yOff * size;
                }
                ctx.save();
                ctx.translate(x + ox, y + oy);
                ctx.rotate(angle);
                const eyeOffset = size * 0.55;
                const eyeAngle = Math.PI / 3;
                const lx = Math.cos(eyeAngle) * eyeOffset;
                const ly = Math.sin(eyeAngle) * eyeOffset;
                const rx = Math.cos(-eyeAngle) * eyeOffset;
                const ry = Math.sin(-eyeAngle) * eyeOffset;
                switch (id) {
                    case "crown": {
                        ctx.strokeStyle = "#e0a800";
                        ctx.lineWidth = size * 0.2;
                        ctx.beginPath();
                        ctx.arc(0, 0, size * 0.65, Math.PI * 1.15, Math.PI * 1.85);
                        ctx.stroke();
                        ctx.fillStyle = "#e0a800";
                        for (let i = 0; i < 5; i++) {
                            const t = i / 4,
                                a = Math.PI * 1.15 + t * Math.PI * 0.7;
                            const px = Math.cos(a) * size * 0.65,
                                py = Math.sin(a) * size * 0.65;
                            ctx.beginPath();
                            ctx.moveTo(px - size * 0.09, py);
                            ctx.lineTo(px + size * 0.09, py);
                            ctx.lineTo(px, py - size * 0.3);
                            ctx.closePath();
                            ctx.fill();
                        }
                        break;
                    }
                    case "tophat": {
                        ctx.fillStyle = "#111111";
                        ctx.beginPath();
                        ctx.ellipse(0, -size * 0.7, size * 0.85, size * 0.2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillRect(-size * 0.55, -size * 1.7, size * 1.1, size);
                        ctx.beginPath();
                        ctx.ellipse(0, -size * 1.7, size * 0.55, size * 0.15, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#cc2244";
                        ctx.fillRect(-size * 0.55, -size * 1.15, size * 1.1, size * 0.18);
                        break;
                    }
                    case "bunny": {
                        ctx.fillStyle = "#ff9ec8";
                        ctx.beginPath();
                        ctx.ellipse(-size * 0.3, -size * 1.1, size * 0.18, size * 0.55, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(size * 0.3, -size * 1.1, size * 0.18, size * 0.55, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#ffc8e0";
                        ctx.beginPath();
                        ctx.ellipse(-size * 0.3, -size * 1.1, size * 0.08, size * 0.4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(size * 0.3, -size * 1.1, size * 0.08, size * 0.4, 0, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case "cat": {
                        ctx.fillStyle = "#b080e0";
                        ctx.beginPath();
                        ctx.moveTo(-size * 0.6, -size * 0.4);
                        ctx.lineTo(-size * 0.75, -size * 1.2);
                        ctx.lineTo(-size * 0.2, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(size * 0.6, -size * 0.4);
                        ctx.lineTo(size * 0.75, -size * 1.2);
                        ctx.lineTo(size * 0.2, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    }
                    case "sunglasses": {
                        ctx.fillStyle = "#1a2a4a";
                        ctx.beginPath();
                        ctx.arc(lx, ly, size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(rx, ry, size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = "#1a2a4a";
                        ctx.lineWidth = size * 0.1;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(rx, ry);
                        ctx.stroke();
                        ctx.fillStyle = "rgba(120,180,255,0.35)";
                        ctx.beginPath();
                        ctx.arc(lx - size * 0.1, ly - size * 0.1, size * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(rx - size * 0.1, ry - size * 0.1, size * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case "3dglasses": {
                        ctx.fillStyle = "#dd2222";
                        ctx.beginPath();
                        ctx.arc(lx, ly, size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#2244dd";
                        ctx.beginPath();
                        ctx.arc(rx, ry, size * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = "#111";
                        ctx.lineWidth = size * 0.08;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(rx, ry);
                        ctx.stroke();
                        break;
                    }
                    case "heartglasses": {
                        const heart = (hx, hy, s) => {
                            ctx.beginPath();
                            ctx.moveTo(hx, hy + s * 0.6);
                            ctx.bezierCurveTo(
                                hx - s * 1.3,
                                hy - s * 0.5,
                                hx - s * 0.4,
                                hy - s * 1.2,
                                hx,
                                hy - s * 0.35
                            );
                            ctx.bezierCurveTo(hx + s * 0.4, hy - s * 1.2, hx + s * 1.3, hy - s * 0.5, hx, hy + s * 0.6);
                            ctx.closePath();
                            ctx.fill();
                        };
                        ctx.fillStyle = "#ff66aa";
                        heart(lx, ly, size * 0.35);
                        heart(rx, ry, size * 0.35);
                        ctx.strokeStyle = "#ff66aa";
                        ctx.lineWidth = size * 0.08;
                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.lineTo(rx, ry);
                        ctx.stroke();
                        break;
                    }
                    case "blonde": {
                        ctx.fillStyle = "#e8c850";
                        ctx.beginPath();
                        ctx.arc(0, -size * 0.15, size * 1.0, Math.PI * 1.05, Math.PI * 1.95);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = "#d4b040";
                        ctx.beginPath();
                        ctx.ellipse(0, -size * 0.15, size * 1.0, size * 0.3, 0, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case "afro": {
                        ctx.fillStyle = "#cc5522";
                        for (let i = 0; i < 10; i++) {
                            const a = (i / 10) * Math.PI * 2,
                                r = size * 1.1;
                            ctx.beginPath();
                            ctx.arc(
                                Math.cos(a) * r * 0.7,
                                Math.sin(a) * r * 0.7 - size * 0.15,
                                size * 0.5,
                                0,
                                Math.PI * 2
                            );
                            ctx.fill();
                        }
                        break;
                    }
                    case "headphones": {
                        ctx.strokeStyle = "#cc6622";
                        ctx.lineWidth = size * 0.18;
                        ctx.beginPath();
                        ctx.arc(0, 0, size * 0.9, Math.PI * 1.1, Math.PI * 1.9);
                        ctx.stroke();
                        ctx.fillStyle = "#cc6622";
                        ctx.beginPath();
                        ctx.arc(-size * 0.9, 0, size * 0.32, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(size * 0.9, 0, size * 0.32, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#8a4418";
                        ctx.beginPath();
                        ctx.arc(-size * 0.9, 0, size * 0.18, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(size * 0.9, 0, size * 0.18, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case "goggles": {
                        ctx.fillStyle = "#22bb22";
                        ctx.beginPath();
                        ctx.ellipse((lx + rx) / 2, (ly + ry) / 2, size * 0.95, size * 0.38, -eyeAngle, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "rgba(180,255,180,0.5)";
                        ctx.beginPath();
                        ctx.ellipse(
                            (lx + rx) / 2 - size * 0.25,
                            (ly + ry) / 2 - size * 0.1,
                            size * 0.35,
                            size * 0.15,
                            -eyeAngle,
                            0,
                            Math.PI * 2
                        );
                        ctx.fill();
                        break;
                    }
                    case "horns": {
                        ctx.fillStyle = "#aa2222";
                        ctx.beginPath();
                        ctx.moveTo(-size * 0.65, -size * 0.35);
                        ctx.quadraticCurveTo(-size * 1.1, -size * 0.9, -size * 0.85, -size * 1.4);
                        ctx.quadraticCurveTo(-size * 0.6, -size * 0.9, -size * 0.35, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(size * 0.65, -size * 0.35);
                        ctx.quadraticCurveTo(size * 1.1, -size * 0.9, size * 0.85, -size * 1.4);
                        ctx.quadraticCurveTo(size * 0.6, -size * 0.9, size * 0.35, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    }
                    case "angelwings": {
                        ctx.fillStyle = "#ffffff";
                        ctx.strokeStyle = "#cccccc";
                        ctx.lineWidth = 2;
                        for (const side of [-1, 1]) {
                            ctx.beginPath();
                            ctx.moveTo(side * size * 0.4, -size * 0.15);
                            ctx.quadraticCurveTo(side * size * 1.6, -size * 1.1, side * size * 1.5, size * 0.15);
                            ctx.quadraticCurveTo(side * size * 1.2, -size * 0.35, side * size * 0.4, size * 0.15);
                            ctx.closePath();
                            ctx.fill();
                            ctx.stroke();
                        }
                        break;
                    }
                    case "bowtie": {
                        ctx.fillStyle = "#ff44aa";
                        ctx.beginPath();
                        ctx.moveTo(-size * 0.15, -size * 0.9);
                        ctx.lineTo(-size * 0.7, -size * 1.25);
                        ctx.lineTo(-size * 0.7, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        ctx.beginPath();
                        ctx.moveTo(size * 0.15, -size * 0.9);
                        ctx.lineTo(size * 0.7, -size * 1.25);
                        ctx.lineTo(size * 0.7, -size * 0.55);
                        ctx.closePath();
                        ctx.fill();
                        ctx.fillStyle = "#cc2288";
                        ctx.beginPath();
                        ctx.arc(0, -size * 0.9, size * 0.15, 0, Math.PI * 2);
                        ctx.fill();
                        break;
                    }
                    case "mustache": {
                        ctx.fillStyle = "#4a2a1a";
                        ctx.beginPath();
                        ctx.moveTo(-size * 0.5, size * 0.3);
                        ctx.quadraticCurveTo(-size * 0.65, -size * 0.1, -size * 0.1, 0);
                        ctx.quadraticCurveTo(0, size * 0.15, size * 0.1, 0);
                        ctx.quadraticCurveTo(size * 0.65, -size * 0.1, size * 0.5, size * 0.3);
                        ctx.quadraticCurveTo(size * 0.2, size * 0.4, 0, size * 0.15);
                        ctx.quadraticCurveTo(-size * 0.2, size * 0.4, -size * 0.5, size * 0.3);
                        ctx.closePath();
                        ctx.fill();
                        break;
                    }
                }
                ctx.restore();
            }

            // ========== GAME SETUP ==========
            const canvas = document.getElementById("gameCanvas");
            const ctx = canvas.getContext("2d");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const WORLD_SIZE = { width: 8000, height: 8000 };
            const ARENA_CENTER_X = WORLD_SIZE.width / 2;
            const ARENA_CENTER_Y = WORLD_SIZE.height / 2;
            const ARENA_RADIUS = Math.min(WORLD_SIZE.width, WORLD_SIZE.height) / 2 - 100;
            const SEGMENT_SPACING = 4;
            const INPUT_LAG_MS = 20;

            // ========== GAME STATE ==========
            let gameTime = 0;
            let score = 0;
            let mass = 0;
            let particles = [];
            let camera2D = { x: 0, y: 0 };
            let isBoosting = false;
            let gameStarted = false;
            let isTyping = false;
const chatInput = document.getElementById("chat-input");
const chatMessages = document.getElementById("chat-messages");
const chatContainer = document.getElementById("chat-container");
            let mouseDirection = 0;
            let mouseDistance = 0;
            let animationFrameId = null;
            let lastRawDesired = null;
            let accumulatedDesired = 0;
            let mouseBuffer = [];
            let debugSpine = false;
            let boostRamp = 0;
            let currentSpeed = 3;
            let lastFrameTime = 0;
            let zoom = 1;

                        // Server-provided state
            let serverFood = []; // from server
            const remoteSnakes = new Map(); // includes AI + other players
            let playerSnapshots = []; // buffered server positions for our own snake
            let gameReady = false;    // true only after first spawn from server

            // ========== FOOD GLOW CACHE ==========
            const glowCache = new Map();

            function getGlowSprite(hue) {
                hue = Math.floor(hue / 10) * 10;
                let sprite = glowCache.get(hue);
                if (sprite) return sprite;
                const S = 64;
                const c = document.createElement("canvas");
                c.width = S;
                c.height = S;
                const cx = c.getContext("2d");
                const grad = cx.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S / 2);
                grad.addColorStop(0, `hsl(${hue}, 100%, 50%)`);
                grad.addColorStop(0.4, `hsl(${hue}, 100%, 50%)`);
                grad.addColorStop(1, "rgba(0,0,0,0)");
                cx.fillStyle = grad;
                cx.fillRect(0, 0, S, S);
                glowCache.set(hue, c);
                return c;
            }

            let glowSprite = null;
            let lastGlowHue = -1;
            let lastGlowBodySize = -1;

            function getBoostGlowSprite(hue, bodySize) {
                const bucketHue = Math.floor(hue / 10) * 10;
                if (glowSprite && lastGlowHue === bucketHue && lastGlowBodySize === bodySize) return glowSprite;
                const S = 256;
                const c = document.createElement("canvas");
                c.width = S;
                c.height = S;
                const cx = c.getContext("2d");
                const R = S / 2;
                const glowRadius = bodySize + 60;
                const bodyRatio = bodySize / glowRadius;
                const f = 1 - bodyRatio;
                const grad = cx.createRadialGradient(R, R, 0, R, R, R);
                grad.addColorStop(0, "rgba(0,0,0,0)");
                grad.addColorStop(bodyRatio * 0.98, "rgba(0,0,0,0)");
                grad.addColorStop(bodyRatio * 0.995, `hsla(${bucketHue}, 100%, 78%, 1.00)`);
                grad.addColorStop(bodyRatio, `hsla(${bucketHue}, 100%, 78%, 1.00)`);
                grad.addColorStop(bodyRatio * 1.025, `hsla(${bucketHue}, 100%, 78%, 1.00)`);
                grad.addColorStop(bodyRatio + f * 0.06, `hsla(${bucketHue}, 100%, 62%, 0.35)`);
                grad.addColorStop(bodyRatio + f * 0.14, `hsla(${bucketHue}, 100%, 55%, 0.14)`);
                grad.addColorStop(bodyRatio + f * 0.28, `hsla(${bucketHue}, 98%, 50%, 0.05)`);
                grad.addColorStop(bodyRatio + f * 0.48, `hsla(${bucketHue}, 95%, 46%, 0.02)`);
                grad.addColorStop(bodyRatio + f * 0.72, `hsla(${bucketHue}, 92%, 44%, 0.008)`);
                grad.addColorStop(bodyRatio + f * 0.9, `hsla(${bucketHue}, 88%, 42%, 0.002)`);
                grad.addColorStop(1.0, "rgba(0,0,0,0)");
                cx.fillStyle = grad;
                cx.fillRect(0, 0, S, S);
                glowSprite = c;
                lastGlowHue = bucketHue;
                lastGlowBodySize = bodySize;
                return c;
            }

            // ========== PLAYER SNAKE ==========
            const playerSnake = {
                id: "player",
                segments: [],
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                speed: 3,
                boostSpeed: 6,
                direction: 0,
                size: 16,
                targetSize: 16,
                length: 10,
                mass: 0,
                x: WORLD_SIZE.width / 2,
                y: WORLD_SIZE.height / 2,
                isAlive: true,
                name: "Player",
                boostAccumulator: 0,
                boostRamp: 0,
            };

            // ========== GAME FUNCTIONS ==========
            function initGame() {
                gameTime = 0;
                score = 0;
                mass = 0;
                particles = [];
                serverFood = [];
                remoteSnakes.clear();
                playerSnapshots = [];
                camera2D = { x: 0, y: 0 };
                lastRawDesired = null;
                accumulatedDesired = 0;
                mouseBuffer = [];
                zoom = 1;

                const nameInput = document.getElementById("name-input");
                const enteredName = nameInput ? nameInput.value.trim() : "";
                playerSnake.name = enteredName ? enteredName.slice(0, 48) : "Player";
                playerSnake.segments = [];
                playerSnake.color = `hsl(${savedHue}, 100%, 50%)`;
                playerSnake.direction = Math.random() * Math.PI * 2;
                playerSnake.x = ARENA_CENTER_X;
                playerSnake.y = ARENA_CENTER_Y;
                playerSnake.isAlive = true;
                playerSnake.length = 10;
                playerSnake.targetSize = 16;
                playerSnake.size = 16;
                playerSnake.mass = 0;
                playerSnake.boostAccumulator = 0;
                playerSnake.boostRamp = 0;
                playerSnake._hasSpawned = false;
                gameReady = false;
                boostRamp = 0;
                currentSpeed = playerSnake.speed;
                lastFrameTime = performance.now();

                               for (let i = 0; i < playerSnake.length; i++) {
                    playerSnake.segments.push({ x: playerSnake.x, y: playerSnake.y, size: playerSnake.size });
                }

                                                // Show chat UI
                chatContainer.style.display = "flex";

            function calculateSnakeMass(snake) {
                let m = 0;
                for (let i = 0; i < snake.segments.length; i++) m += Math.PI * Math.pow(snake.segments[i].size, 2);
                return m;
            }

            function updateSegments(snake, spacing) {
                if (snake.segments.length === 0)
                    snake.segments.push({ x: snake.x, y: snake.y, size: snake.targetSize });
                if (!isFinite(snake.length) || snake.length < 1) snake.length = 1;
                snake.segments[0].x = snake.x;
                snake.segments[0].y = snake.y;
                while (snake.segments.length < snake.length) {
                    const tail = snake.segments[snake.segments.length - 1];
                    snake.segments.push({ x: tail.x, y: tail.y, size: tail.size });
                }
                while (snake.segments.length > snake.length) snake.segments.pop();
                for (let i = 1; i < snake.segments.length; i++) {
                    const prev = snake.segments[i - 1],
                        seg = snake.segments[i];
                    const dx = prev.x - seg.x,
                        dy = prev.y - seg.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist > spacing) {
                        const t = (dist - spacing) / dist;
                        seg.x += dx * t;
                        seg.y += dy * t;
                    }
                }
                for (let i = 0; i < snake.segments.length; i++) {
                    const seg = snake.segments[i];
                    seg.size += (snake.targetSize - seg.size) * 0.1;
                }
            }

            function getSpinePoints(snake) {
                const pts = [];
                if (!snake.segments.length) return pts;
                const SPINE_HITBOX_RADIUS = 6;
                pts.push({ x: snake.x, y: snake.y, radius: SPINE_HITBOX_RADIUS });
                const SPINE_STEP = 6;
                for (let i = 1; i < snake.segments.length; i++) {
                    const a = snake.segments[i - 1],
                        b = snake.segments[i];
                    const dx = b.x - a.x,
                        dy = b.y - a.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 0.01) continue;
                    const steps = Math.max(1, Math.floor(dist / SPINE_STEP));
                    for (let s = 1; s <= steps; s++) {
                        const t = s / steps;
                        pts.push({ x: a.x + dx * t, y: a.y + dy * t, radius: SPINE_HITBOX_RADIUS });
                    }
                }
                return pts;
            }

                            });
                            if (!response.ok) throw new Error("Server error");
                            
                                                        const reader = response.body.getReader();
                            const decoder = new TextDecoder();
                            let buffer = ""; // Buffer to hold incomplete network chunks
                            
                            while (true) {
                                const { done, value } = await reader.read();
                                if (done) break;
                                
                                buffer += decoder.decode(value, { stream: true });
                                const parts = buffer.split('\n\n');
                                buffer = parts.pop(); // Keep the last incomplete chunk in the buffer
                                
                                for (const part of parts) {
                                    if (part.startsWith('data: ')) {
                                        let data;
                                        try {
                                            data = JSON.parse(part.slice(6));
                                        } catch (e) {

                                            continue; // Safely skip broken chunks
                                        }
                                        
                                                                                if (data.type === 'progress') {
                                            botContent.innerHTML = `<span style="color:#6e6eae; font-style: italic;">${data.text}</span>`;

                                                botContent.dataset.isStreaming = "true";

                                            botContent.dataset.isStreaming = "";
                                            
                                            // Check if it's a JSON drawing command
                                            try {
                                                const parsed = JSON.parse(data.text);

                                                    await typeMarkdown(data.text, botContent);
                                                }
                                            }

                                        }
